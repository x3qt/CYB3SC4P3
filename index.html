<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>CYB3SC4P3</title>
  <style>
    :root {
      --panel: rgba(7, 10, 24, 0.93);
      --cyan: #8cffe8;
      --amber: #ffdc8a;
      --violet: #e1baff;
      --danger: #ff8b99;
    }
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 100;
      background: var(--panel);
      color: var(--cyan);
      border-left: 2px solid var(--cyan);
      padding: 7px 10px;
      font: 12px/1.45 monospace;
      display: none;
    }
    #mapAttribution {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 100;
      padding: 2px 5px;
      color: #d9fff4;
      background: var(--panel);
      font: 11px/1.35 monospace;
    }
    #reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: var(--cyan);
      box-shadow: 0 0 7px #5effd8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 100;
      display: none;
    }
    #chargeMeter {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      color: var(--amber);
      min-width: 148px;
      text-align: right;
      background: var(--panel);
      border-bottom: 2px solid var(--amber);
      padding: 6px 9px;
      font: 700 12px/1.4 monospace;
      display: none;
    }
    #health {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: var(--panel);
      color: var(--cyan);
      border-bottom: 2px solid var(--cyan);
      padding: 6px 9px;
      font: 700 12px/1.4 monospace;
      display: none;
    }
    #arenaStatus {
      position: absolute;
      top: 44px;
      right: 10px;
      z-index: 100;
      max-width: min(290px, 70vw);
      padding: 6px 8px;
      background: var(--panel);
      color: var(--cyan);
      border-right: 2px solid #467b79;
      font: 13px/1.4 monospace;
      text-align: right;
      pointer-events: none;
    }
    #hackStatus { color: var(--violet); }
    #moonStatus { color: var(--danger); }
    #patrolStatus { color: var(--violet); }
    #enforcerStatus { color: var(--amber); }
    #scanOverlay {
      position: absolute;
      inset: 0;
      z-index: 95;
      font: 12px/1.3 monospace;
      pointer-events: none;
    }
    #scanOverlay::before, #breachOverlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 45%, rgba(94, 255, 223, .08) 50%, transparent 54%);
      background-size: 100% 220%;
      animation: hudSweep 3.2s linear infinite;
    }
    #scanOverlay::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(129, 255, 224, .27);
      box-shadow: inset 0 0 45px rgba(27, 178, 208, .16);
    }
    #breachOverlay {
      position: fixed;
      inset: 0;
      z-index: 180;
      pointer-events: none;
      box-shadow: inset 0 0 80px rgba(141, 255, 230, .5);
      animation: breachFade 1.15s ease-out both;
    }
    #breachOverlay::before {
      background-image: linear-gradient(transparent 43%, rgba(255, 210, 130, .16) 49%, rgba(160, 255, 234, .72) 50%, transparent 53%);
      animation: hudSweep .85s ease-out both;
    }
    @keyframes hudSweep {
      from { background-position: 0 148%; }
      to { background-position: 0 -48%; }
    }
    @keyframes breachFade { from { opacity: 1; } to { opacity: 0; } }
    #scanHeading, #scanTarget, .scanSectorLabel {
      position: absolute;
      top: 0;
      left: 0;
    }
    #scanHeading {
      width: 28px;
      color: white;
      font-size: 22px;
      text-align: center;
      text-shadow: 0 0 7px #667dff, 0 0 3px #000;
    }
    #scanTarget, .scanSectorLabel {
      padding: 3px 6px;
      text-align: center;
      background: rgba(7, 9, 25, 0.88);
    }
    #scanTarget {
      z-index: 2;
      max-width: 170px;
      width: max-content;
      color: #ffdc8a;
      border: 1px solid currentColor;
    }
    #scanTarget::after {
      content: "";
      position: absolute;
      inset: -4px;
      border: 1px solid currentColor;
      animation: scanMarker 1.7s ease-out infinite;
    }
    @keyframes scanMarker {
      from { opacity: .7; transform: scale(1); }
      to { opacity: 0; transform: scale(1.24, 1.55); }
    }
    #scanTarget.extraction { color: #72ffe1; }
    .scanSectorLabel {
      width: max-content;
      max-width: 125px;
      color: #b5bfd8;
      font-size: 11px;
    }
    #scanLegend {
      position: absolute;
      bottom: 42px;
      left: 10px;
      padding: 4px 6px;
      background: rgba(7, 9, 25, 0.88);
      color: #72ffe1;
    }
    #chargeMeter.pulse {
      animation: colorPulse 1.25s ease-in-out infinite;
    }
    @keyframes colorPulse {
      50% { color: #f4e1ff; border-color: var(--violet); box-shadow: 0 0 16px #ab51de66; }
    }
    #openingBackdrop {
      position: fixed;
      inset: 0;
      z-index: 190;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 60%, #451253 0%, #1c102f 34%, transparent 68%),
        radial-gradient(ellipse at 15% 10%, #092a35 0%, transparent 52%),
        #060710;
      pointer-events: none;
    }
    #openingBackdrop::before, #openingBackdrop::after {
      content: "";
      position: absolute;
    }
    #openingBackdrop::before {
      left: -33%;
      top: 54%;
      width: 166%;
      height: 100%;
      transform: perspective(320px) rotateX(58deg);
      transform-origin: 50% 0;
      background-image:
        linear-gradient(90deg, rgba(53, 246, 229, 0.5) 1px, transparent 1px),
        linear-gradient(rgba(255, 79, 183, 0.45) 1px, transparent 1px);
      background-size: 64px 52px;
      animation: openingGrid 1.6s linear infinite;
    }
    #openingBackdrop::after {
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 36%, rgba(4, 3, 13, 0.78) 100%),
        linear-gradient(transparent 46%, rgba(71, 250, 224, 0.11) 50%, transparent 54%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.21) 0 1px, transparent 1px 4px);
      background-size: 100% 100%, 100% 180%, auto;
      animation: openingSweep 3s linear infinite;
    }
    #openingBackdrop.extraction-outro {
      animation: rooftopToGrid .8s ease-in-out both;
    }
    #extractionFlash {
      position: fixed;
      inset: 0;
      z-index: 185;
      pointer-events: none;
      background: radial-gradient(ellipse at center, #e5fff7 10%, #91ffe7 56%, #2f7592 100%);
      animation: extractionBloom .72s linear both;
    }
    @keyframes extractionBloom {
      0%, 20% { opacity: 0; }
      35% { opacity: .97; }
      51% { opacity: .66; }
      to { opacity: 0; }
    }
    @keyframes rooftopToGrid {
      from { opacity: 0; clip-path: inset(47% 0 47% 0); }
      45% { opacity: .75; }
      to { opacity: 1; clip-path: inset(0); }
    }
    #intro {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 92vw;
      transform: translate(-50%, -50%);
      font: 700 clamp(18px, 4vw, 34px)/1.2 monospace;
      text-align: center;
      color: #aaffee;
      text-shadow: 0 0 18px #13bfae;
      z-index: 200;
    }
    #intro[data-stage="studio"] {
      color: #ffe5ff;
      font-size: clamp(48px, 13vw, 132px);
      letter-spacing: 0.15em;
      text-shadow: 2px 0 #ff389e, -2px 0 #52fff0, 0 0 32px #fe2aaa;
      animation: openingTitle 3s both;
    }
    #intro[data-stage="title"] {
      font-size: clamp(32px, 9vw, 104px);
      letter-spacing: 0.12em;
      text-shadow: 2px 0 #ff428f, 0 0 32px #30f5e0;
      animation: openingGameTitle 3s both;
    }
    #intro[data-stage="error"] { color: #ff7092; }
    #interceptHint {
      position: fixed;
      bottom: 10%;
      left: 50%;
      width: min(560px, 88vw);
      transform: translateX(-50%);
      padding: 9px 12px;
      border-top: 1px solid rgba(121, 255, 221, 0.45);
      color: #c1ffed;
      background: rgba(6, 9, 22, 0.88);
      font: 14px/1.45 monospace;
      text-align: center;
      z-index: 305;
      pointer-events: none;
    }
    #extractionReport {
      position: fixed;
      inset: 0;
      z-index: 220;
      display: grid;
      place-content: center;
      overflow: hidden;
      isolation: isolate;
      text-align: center;
      color: var(--cyan);
      padding: 20px;
      font: 14px/1.6 monospace;
    }
    #extractionReport[hidden] { display: none; }
    #extractionReport::before, #extractionReport::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 50% auto auto 50%;
      width: min(64vw, 540px);
      aspect-ratio: 1;
      border: 1px solid #9dffe0;
      border-radius: 50%;
      box-shadow: 0 0 22px #33dfbb, inset 0 0 22px #33dfbb77;
      transform: translate(-50%, -50%) scale(.78);
      opacity: .3;
      animation: extractionWave 2.6s ease-out infinite;
    }
    #extractionReport::after { animation-delay: -.8s; }
    #extractionReport h1 {
      margin: 4px 0 12px;
      font-size: clamp(35px, 7.5vw, 100px);
      line-height: .98;
      text-shadow: 2px 0 #de4a96, -2px 0 #3cf5cd, 0 0 32px #24af98;
      animation: extractionTitle .9s ease-out both;
    }
    #extractionReport p { margin: 4px 0; color: #d9fff4; }
    @keyframes extractionWave {
      from { transform: translate(-50%, -50%) scale(.24); opacity: .65; }
      to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }
    @keyframes extractionTitle {
      from { opacity: 0; transform: scale(.87); }
      to { opacity: 1; transform: scale(1); }
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 82vw;
      width: max-content;
      font: 700 clamp(18px, 4vw, 32px)/1.25 monospace;
      text-align: center;
      color: red;
      z-index: 300;
      display: none;
      background: var(--panel);
      padding: 20px;
      border-radius: 5px;
    }
    #retry-map {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 301;
      padding: 10px 16px;
      color: #fff;
      background: #230b30;
      border: 1px solid #ff00ff;
      font: 16px monospace;
      cursor: pointer;
    }
    #message {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: min(450px, calc(100% - 435px));
      font: 700 14px/1.45 monospace;
      color: #f1d8ff;
      z-index: 200;
      opacity: 0;
      text-align: center;
      background: var(--panel);
      padding: 8px 12px;
      border-top: 2px solid var(--violet);
      transition: opacity 0.5s;
      pointer-events: none;
    }
    #hitIndicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 0, 0, 0.7);
      opacity: 0;
      pointer-events: none;
      z-index: 150;
    }
    #noiseOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: none;
      z-index: 250;
    }
    #controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: none;
    }
    .joystick, .control-button {
      pointer-events: auto;
    }
    .joystick {
      position: absolute;
      bottom: 20px;
      width: min(34vw, 29vh, 225px);
      height: min(34vw, 29vh, 225px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      touch-action: none;
    }
    #left-joystick {
      left: 20px;
    }
    #right-joystick {
      right: 20px;
    }
    #fly-button {
      position: absolute;
      right: 20px;
      top: 33%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      text-align: center;
      line-height: 60px;
      border-radius: 50%;
      touch-action: none;
    }
    #map-button {
      position: absolute;
      left: 20px;
      top: 33%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      text-align: center;
      line-height: 60px;
      border-radius: 50%;
      touch-action: none;
    }
    .control-button {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      text-align: center;
      line-height: 60px;
      border-radius: 5px;
      touch-action: none;
    }
    #fly-button.active {
      background: #3d205d;
      border: 1px solid var(--violet);
      box-shadow: 0 0 15px #9a61d879;
    }
    #map-button.active {
      background: #143f45;
      border: 1px solid var(--cyan);
      box-shadow: 0 0 15px #45ddc879;
    }
    @keyframes openingGrid {
      to { background-position: 0 52px; }
    }
    @keyframes openingSweep {
      from { background-position: center, center 150%, center; }
      to { background-position: center, center -50%, center; }
    }
    @keyframes openingTitle {
      0% { opacity: 0.72; transform: translate(-50%, -50%) scale(0.97); }
      12%, 86% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0.72; transform: translate(-50%, -50%) scale(1.015); }
    }
    @keyframes openingGameTitle {
      0% { opacity: 0.72; transform: translate(-50%, -50%) scale(1.025); }
      16%, 86% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0.72; transform: translate(-50%, -50%) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #openingBackdrop::before, #openingBackdrop::after,
      #openingBackdrop.extraction-outro, #extractionFlash,
      #intro[data-stage="studio"], #intro[data-stage="title"],
      #scanOverlay::before, #scanTarget::after, #chargeMeter.pulse,
      #extractionReport::before, #extractionReport::after, #extractionReport h1 { animation: none; }
      #breachOverlay::before { animation: none; background: none; }
    }
    @media (max-width: 980px) {
      #message { top: auto; bottom: 26%; width: min(400px, calc(100% - 48px)); }
      #arenaStatus { max-width: min(280px, 77vw); font-size: 12px; }
      #info { max-width: calc(100% - 40px); }
      #scanLegend { bottom: 52px; }
    }
    @media (max-width: 390px) {
      #chargeMeter, #health { min-width: 0; font-size: 10px; }
    }
    @keyframes blink {
      0% { opacity: 0; }
      50% { opacity: 0.5; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="info">WASD Move · Mouse Aim · Left click Fire · F Hack · M Scan</div>
  <a id="mapAttribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" hidden>© OpenStreetMap contributors</a>
  <div id="chargeMeter">DECRYPT BUFFER 0%</div>
  <div id="health">LINK INTEGRITY 100%</div>
  <div id="arenaStatus" hidden>
    <div id="arenaObjective"></div>
    <div id="hackStatus"></div>
    <div id="moonStatus"></div>
    <div id="patrolStatus"></div>
    <div id="enforcerStatus"></div>
  </div>
  <div id="scanOverlay" hidden>
    <div id="scanSectors"></div>
    <div id="scanHeading" aria-hidden="true">▲</div>
    <div id="scanTarget"></div>
    <div id="scanLegend">Teal dashes · Open route through ICE</div>
  </div>
  <div id="breachOverlay" hidden aria-hidden="true"></div>
  <div id="extractionFlash" hidden aria-hidden="true"></div>
  <div id="openingBackdrop" aria-hidden="true"></div>
  <div id="intro" hidden></div>
  <div id="interceptHint" hidden></div>
  <section id="extractionReport" hidden role="status">
    <h1>EXTRACTION COMPLETE</h1>
    <p>PAYLOAD INTACT · TRACE COLD</p>
  </section>
  <div id="gameOver"></div>
  <button id="retry-map" type="button" hidden>Retry sector sync</button>
  <div id="message" role="status"></div>
  <div id="hitIndicator"></div>
  <div id="reticle"></div>
  <canvas id="noiseOverlay"></canvas>
  <div id="controls">
    <div id="left-joystick" class="joystick"></div>
    <div id="right-joystick" class="joystick"></div>
    <div id="map-button" class="control-button">SCAN</div>
    <div id="fly-button" class="control-button">HACK</div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040348);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.rotation.order = 'YXZ';
    const playerHeight = 4;
    const playerRadius = 0.25;
    // Initial position will be set after cityBounds is calculated
    camera.position.set(0, playerHeight, 0);
    const birdCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
    birdCamera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(100, 100, 100);
    const ambientLight = new THREE.AmbientLight(0x404040);

    const groundGeometry = new THREE.PlaneGeometry(1, 1);
    const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x080808, side: THREE.DoubleSide });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;

    const sunGeometry = new THREE.SphereGeometry(25, 25, 25);
    const sunMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 5 });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    sun.position.set(0, 1000, 0);

    const baseLat = 53.89;
    const baseLon = 27.55;
    const metersPerLat = 111320;
    const metersPerLon = 111320 * Math.cos(baseLat * Math.PI / 180);
    function latLonToXY(lat, lon) {
      const x = (lon - baseLon) * metersPerLon;
      const y = (lat - baseLat) * metersPerLat;
      return { x: -x, y };
    }

    let font = null;
    const fullCharge = 100;
    const transportCharge = 5;

    let cars = [];
    let pedestrians = [];
    let neonAds = [];
    let explosions = [];
    let airplanes = [];
    let cityBounds = new THREE.Box3();
    let wallParticleSystems = [];
    let walls = [];
    let buildings = [];
    let roads = [];
    const sections = new Map();
    const liveBuildings = new Map();



    const chargeMeter = document.getElementById("chargeMeter");
    let charge = 0;
    function updateChargeMeter() {
      const label = "DECRYPT BUFFER " + Math.floor(charge) + "%";
      if (chargeMeter.textContent !== label) chargeMeter.textContent = label;
      if (dataVault) {
        const armed = charge >= fullCharge;
        const { core, beacon } = dataVault.userData;
        const color = armed ? vaultReadyColor : vaultBeaconColor;
        core.material.color.setHex(color);
        beacon.userData.shell.material.color.setHex(color);
        beacon.userData.base.material.color.setHex(color);
        beacon.userData.sweeps.forEach(sweep => sweep.material.color.setHex(color));
      }
      updateArenaStatus();
    }

    let playerHealth = 100;
    let isDead = false;
    let isVictorious = false;
    let huntingPedestrians = 0;
    let sightedEnforcers = 0;
    const pedestrianElevation = 2.25;
    const carElevation = 0.0;
    const healthDisplay = document.getElementById('health');

    const carGeometry = new THREE.BoxGeometry(9, 4.5, 3);
    carGeometry.translate(0, 4.5 / 2, 0);

    const pedTorsoGeometry = new THREE.CylinderGeometry(0.6, 0.8, 2.5, 8);
    pedTorsoGeometry.translate(0, 1.25, 0);
    const pedHeadGeometry = new THREE.SphereGeometry(0.5, 12, 12);
    const pedArmUpperGeometry = new THREE.CylinderGeometry(0.25, 0.25, 1.25, 8);
    const pedArmLowerGeometry = new THREE.CylinderGeometry(0.2, 0.2, 1.25, 8);
    const pedLegUpperGeometry = new THREE.CylinderGeometry(0.35, 0.35, 1.5, 8);
    const pedLegLowerGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 8);
    const pedEyeGeometry = new THREE.SphereGeometry(0.1, 8, 8);

    const cyberpunkColors = [0xff0066, 0x00ffcc, 0x6600ff, 0xff6600, 0x00ff00];
    const wallParticleColor = 0xffff99;

    const airplaneGeometry = new THREE.BoxGeometry(4, 2, 10);
    const airplaneMaterial = new THREE.MeshPhongMaterial({
      color: 0xff00ff,
      emissive: 0xff00ff,
      emissiveIntensity: 0.9
    });

    const corporations = [
      { name: "Veyrspan Data", color: 0x799aff },
      { name: "Nullglass Exchange", color: 0xff78d3 },
      { name: "Cindervane Logic", color: 0x84df93 },
      { name: "Sablevector Relay", color: 0x8ce3ff },
      { name: "Korrivex Transit", color: 0xa4a6f7 },
      { name: "Nacreline Storage", color: 0xe5f2ff },
      { name: "Duskframe Works", color: 0xdb96bc },
      { name: "Virelock Security", color: 0x75c0ec },
      { name: "Vespercoil Networks", color: 0xc3e89c }
    ];

    const playerShotRange = 1000;
    const playerLaserOriginX = 0;
    const playerLaserOriginY = -0.5;
    const playerLaserOriginZ = -1;

    const pedLaserOriginX = 0.7;
    const pedLaserOriginY = 1.5;
    const pedLaserOriginZ = 0;

    const moveSpeed = 1.0;
    const shootingHitboxRadius = 1.0;
    const numCars = 32;
    const transportSupplyInterval = 2.5;

function disposeObjects(objects) {

        geometries.add(child.geometry);

        materials.add(child.material);

    });
  }
  for (const geometry of geometries) geometry.dispose();
  for (const material of materials) material.dispose();
}

function addParticleSystemToWall(wall, direction) {
  if (!enableWallAnimation) return;
  const spacing = 5;
  const particleCountBase = direction === 'x' ? 
    Math.floor(wall.geometry.parameters.width / spacing) : 
    Math.floor(wall.geometry.parameters.depth / spacing);
  const particleCount = Math.max(0, Math.floor(particleCountBase * wallParticleDensity * 1));
  
  if (particleCount <= 0) {
    console.warn(`Skipping particle system for wall with ${direction === 'x' ? 'width' : 'depth'} ${direction === 'x' ? wall.geometry.parameters.width : wall.geometry.parameters.depth}`);
    return;
  }

  const positions = new Float32Array(particleCount * 3);
  const speeds = new Float32Array(particleCount);
  const baseYs = new Float32Array(particleCount);

  for (let i = 0; i < particleCount; i++) {
    let x, z;
    if (direction === 'x') {
      x = wall.position.x - wall.geometry.parameters.width / 2 + (i % particleCountBase) * spacing;
      z = wall.position.z;
    } else {
      x = wall.position.x;
      z = wall.position.z - wall.geometry.parameters.depth / 2 + (i % particleCountBase) * spacing;
    }
    const y = Math.random() * wallHeight * 0.3;
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
    speeds[i] = 1 + Math.random() * 2;
    baseYs[i] = y;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({
    color: wallParticleColor,
    size: 0.5,
    transparent: false
  });
  
  const particleSystem = new THREE.Points(geometry, material);
  particleSystem.userData = { speeds, baseYs, direction, wall: wall };
  scene.add(particleSystem);
  wallParticleSystems.push(particleSystem);
}

function appendGroundStrip(positions, x, z, endX, endZ, width, y) {

  const dz = (x - endX) / length * width / 2;
  positions.push(
    x + dx, y, z + dz, x - dx, y, z - dz, endX + dx, y, endZ + dz,
    endX + dx, y, endZ + dz, x - dx, y, z - dz, endX - dx, y, endZ - dz

const buildingCellSize = 32;
const buildingCells = new Map();

function rebuildBuildingIndex() {
  buildingCells.clear();
  for (const building of buildings) {
    const { min, max } = building.userData.box;
    for (let x = Math.floor(min.x / buildingCellSize); x <= Math.floor(max.x / buildingCellSize); x++) {
      for (let z = Math.floor(min.z / buildingCellSize); z <= Math.floor(max.z / buildingCellSize); z++) {
        const key = sectionKey(x, z);
        if (!buildingCells.has(key)) buildingCells.set(key, []);
        buildingCells.get(key).push(building);
      }
    }
  }
}

function buildingsInBounds(minX, minZ, maxX, maxZ) {
  const candidates = new Set();
  for (let x = Math.floor(minX / buildingCellSize); x <= Math.floor(maxX / buildingCellSize); x++) {
    for (let z = Math.floor(minZ / buildingCellSize); z <= Math.floor(maxZ / buildingCellSize); z++) {
      const cell = buildingCells.get(sectionKey(x, z));
      if (cell) for (const building of cell) candidates.add(building);
    }
  }
  return candidates;
}

function raycastBuildings(raycaster, filter) {
  const { origin, direction } = raycaster.ray;
  const endX = origin.x + direction.x * raycaster.far;
  const endZ = origin.z + direction.z * raycaster.far;
  const candidates = Array.from(buildingsInBounds(
    Math.min(origin.x, endX), Math.min(origin.z, endZ),
    Math.max(origin.x, endX), Math.max(origin.z, endZ)
  ));
  return raycaster.intersectObjects(filter ? candidates.filter(filter) : candidates, false);
}

function isSpawnClear(position) {
  const cell = buildingCells.get(sectionKey(
    Math.floor(position.x / buildingCellSize), Math.floor(position.z / buildingCellSize)
  ));
  return !cell || !cell.some(building => building.userData.box.containsPoint(position));
}

function findSafeSpawnPosition(center, bounds) {
  const position = center.clone();
  position.y = playerHeight;
  for (let attempt = 0; attempt < 50; attempt++) {

    position.x = bounds.min.x + Math.random() * (bounds.max.x - bounds.min.x);
    position.z = bounds.min.z + Math.random() * (bounds.max.z - bounds.min.z);
  }
  return position;
}

async function fetchMapData(x, z) {
  const url = "./maps/" + sectionKey(x, z) + ".json";
  const deadline = performance.now() + 30_000;
  let lastError;

  for (const retryDelay of [0, 1000, 2000]) {
    if (deadline - performance.now() <= retryDelay) break;
    if (retryDelay) await new Promise(resolve => setTimeout(resolve, retryDelay));

    const remaining = deadline - performance.now();
    if (remaining <= 0) break;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), Math.min(10_000, remaining));
    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: retryDelay ? "reload" : "default"
      });
      if (!response.ok) {
        const status = response.status;
        lastError = new Error("Map snapshot returned HTTP " + status);
        if (status === 408 || status === 429 || status >= 500) continue;
        throw lastError;
      }
      const data = await response.json();
      if (!Array.isArray(data?.elements) || data.elements.length === 0) {
        throw new Error("Invalid map snapshot");
      }
      return data;
    } catch (error) {
      if (controller.signal.aborted) lastError = new Error("Map snapshot request timed out", { cause: error });
      else if (error instanceof TypeError) lastError = error;
      else throw error;
    } finally {
      clearTimeout(timeout);
    }
  }
  throw lastError ?? new Error("Map snapshot load timed out");
}

function generateMapData(x, z, { minLat, maxLat, minLon, maxLon }) {
  const elements = [];
  const blocks = 6;
  let seed = (Math.imul(x, 73856093) ^ Math.imul(z, 19349663) ^ 83492791) >>> 0;
  const random = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  function addWay(points, tags, closed = false) {
    const nodes = points.map(([column, row]) => {
      const id = elements.length + 1;
      const lat = minLat + (maxLat - minLat) * row / blocks;
      const lon = minLon + (maxLon - minLon) * column / blocks;
      elements.push({ type: 'node', id, lat, lon });
      return id;
    });
    if (closed) nodes.push(nodes[0]);
    elements.push({ type: 'way', id: elements.length + 1, nodes, tags });
  }

  // Roads on the minimum edges connect the generated sectors at their seams.
  for (const street of [1, 2, 3, 4, 5, 0]) {
    for (let block = 0; block < blocks; block++) {
      addWay([[block, street], [block + 0.5, street], [block + 1, street]], { highway: 'residential' });
      addWay([[street, block], [street, block + 0.5], [street, block + 1]], { highway: 'residential' });
    }
  }

  for (let column = 0; column < blocks; column++) {
    for (let row = 0; row < blocks; row++) {
      for (const [u, v] of [[0.15, 0.15], [0.56, 0.15], [0.15, 0.56], [0.56, 0.56]]) {
        if (random() < 0.2) continue;
        const left = column + u;
        const bottom = row + v;
        const right = left + 0.18 + random() * 0.1;
        const top = bottom + 0.18 + random() * 0.1;
        addWay([[left, bottom], [right, bottom], [right, top], [left, top]], { building: 'yes' }, true);
      }
    }
  }
  return { elements };
}

async function loadMapSection(x, z) {

    } catch (error) {
      console.warn("Map snapshot unavailable for sector " + sectionKey(x, z) + ". Generating that sector.", error);
    }
  }
  return buildMapSection(x, z, bounds.box, generateMapData(x, z, bounds));
}

              section.group.add(textMesh);
            }
          } else if (el.tags.building && isClosed) {
            const shapePoints = points.map(p => new THREE.Vector2(p.x, p.z));
            const shape = new THREE.Shape(shapePoints);
            const buildingHeight = buildingHeightMin + Math.random() * (buildingHeightMax - buildingHeightMin);
            const extrudeSettings = { steps: 1, depth: buildingHeight, bevelEnabled: false };
            const buildingGeometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const buildingMaterial = new THREE.MeshPhongMaterial({
              color: 0x111111,
              emissive: cyberpunkColors[Math.floor(Math.random() * cyberpunkColors.length)],
              emissiveIntensity: 0.5
            });
            const buildingMesh = new THREE.Mesh(buildingGeometry, buildingMaterial);
            buildingMesh.rotation.x = Math.PI / 2;
            buildingMesh.position.y = buildingHeight;
            section.group.add(buildingMesh);
            section.buildings.push(buildingMesh);
            const box = new THREE.Box3().setFromObject(buildingMesh);
            buildingMesh.userData.box = box;
            buildingMesh.userData.collisionEdges = buildCollisionEdges(points.slice(0, -1));
            buildingMesh.userData.isCleared = false;
            if (fromOpenStreetMap && Number.isSafeInteger(el.id)) buildingMesh.userData.wayId = el.id;
          } else if (el.tags.waterway) {
            const riverMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff, linewidth: 15 });
            const riverGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const riverLine = new THREE.Line(riverGeometry, riverMaterial);
            riverLine.position.y = 0;
            section.group.add(riverLine);
          }
        }
      }
    });
  } catch (error) {
    disposeObjects([section.group]);
    throw error;
  }
  return section;
}

function retainSectionBuildings(section) {
  section.buildings = section.buildings.map(building => {
    const { wayId } = building.userData;
    if (wayId === undefined) return building;
    let retained = liveBuildings.get(wayId);
    if (retained) {
      disposeObjects([building]);
    } else {
      retained = { mesh: building, references: 0 };
      liveBuildings.set(wayId, retained);
      scene.add(building);
    }
    retained.references++;
    return retained.mesh;
  });
}

function releaseSection(section) {
  const removed = [section.group];
  neonAds = neonAds.filter(ad => !section.holoAds.includes(ad));
  section.holoTexture?.dispose();
  section.scanLabel.remove();
  for (const building of section.buildings) {
    const { wayId } = building.userData;
    if (wayId === undefined) continue;
    const retained = liveBuildings.get(wayId);
    if (--retained.references === 0) {
      liveBuildings.delete(wayId);
      removed.push(building);
    }
  }
  if (section.buildings.includes(highlightedBuilding)) clearBuildingHighlight();
  disposeObjects(removed);
}

function activateSection(section) {
  if (extractionSite?.point) {
    // Keep the original spawn clear when another sector includes overlapping geometry.
    section.buildings = section.buildings.filter(building => {
      if (!blocksObjectiveSite(building, extractionSite.point, extractionSite.radius)) return true;
      disposeObjects([building]);
      return false;
    });
  }
  retainSectionBuildings(section);
  const sectionId = sectionKey(section.x, section.z);
  const replaced = sections.get(sectionId);
  if (replaced) releaseSection(replaced);
  const routeIndex = arenaRoute.findIndex(tile => tile.x === section.x && tile.z === section.z);
  section.corporation = corporations[routeIndex];
  section.holoAds = [];
  section.scanLabel = document.createElement('div');
  section.scanLabel.className = 'scanSectorLabel';
  section.scanLabel.textContent = section.corporation.name;
  scanSectors.appendChild(section.scanLabel);
  sections.set(sectionId, section);
  scene.add(section.group);
  for (const [key, previous] of sections) {
    if (Math.abs(previous.x) > 1 || Math.abs(previous.z) > 1) {
      releaseSection(previous);
      sections.delete(key);
    }
  }
  activeSection = section;
  mapAttribution.hidden = ![...sections.values()].some(tile => tile.fromOpenStreetMap);
  rebuildSectionWalls();

  section.spawnRoads = getSpawnRoads(section);
  if (section.spawnRoads.length === 0) {
    // A route inside the section keeps the breach objective available without mapped roads.
    const { min, max } = section.box;
    const insetX = (max.x - min.x) / 4;
    const insetZ = (max.z - min.z) / 4;
    const route = {
      points: [
        new THREE.Vector3(min.x + insetX, 0, min.z + insetZ),
        new THREE.Vector3(max.x - insetX, 0, min.z + insetZ),
        new THREE.Vector3(max.x - insetX, 0, max.z - insetZ),
        new THREE.Vector3(min.x + insetX, 0, max.z - insetZ),
        new THREE.Vector3(min.x + insetX, 0, min.z + insetZ)
      ]
    };
    section.roads.push(route);
    roads.push(route);
    section.spawnRoads = getSpawnRoads(section);
  }
  rebuildRoadIndex();
}

function spawnSectionTraffic(section) {
  transportSupplyTimer = transportSupplyInterval;

function requestInitialSector() {
  const start = arenaRoute[0];
  const request = { settled: false };
  request.result = loadMapSection(start.x, start.z)
    .then(section => ({ section }), error => ({ error }))
    .finally(() => { request.settled = true; });
  return request;
}

async function loadInitialSection(request = requestInitialSector()) {
  showOpeningStage('connection', 'INTERCEPTING CONNECTION...');
  const hints = startInterceptHints();
  const interceptDots = startLoadingDots(introDiv, 'INTERCEPTING CONNECTION');
  await waitForOpeningStage(interceptionDuration);
  clearInterval(interceptDots);

  let syncDots;
  if (!request.settled) {
    showOpeningStage('sync', 'SYNCING SECTOR GRID...');
    syncDots = startLoadingDots(introDiv, 'SYNCING SECTOR GRID');
  }
  const { section, error } = await request.result;
  stopInterceptHints(hints);
  if (syncDots !== undefined) clearInterval(syncDots);
  if (!section) {
    console.error("Failed to load initial map section:", error);
    showOpeningStage('error', 'SECTOR SYNC FAILED');
    offerMapRetry(loadInitialSection);
    return;
  }

  let origin = section;
  activateSection(origin);
  extractionSite = findOffRoadSpawn(origin);
  if (!extractionSite) {
    const start = arenaRoute[0];
    const bounds = sectionBounds(start.x, start.z);
    origin = buildMapSection(start.x, start.z, bounds.box, generateMapData(start.x, start.z, bounds));
    activateSection(origin);
    extractionSite = findOffRoadSpawn(origin);
  }
  if (!extractionSite) {
    showOpeningStage('error', 'NO SAFE JACK-IN POINT');
    offerMapRetry(loadInitialSection);
    return;
  }
  camera.position.copy(extractionSite.point);
  camera.position.y = playerHeight;
  placeDataVault();
  spawnSectionTraffic(activeSection);
  scene.add(directionalLight, ambientLight, ground, sun);
  sceneLoaded = true;
  startGameplay();
}

}

function getSpawnRoads(section) {
  return section.roads.flatMap(road => {
    const indices = [];
    for (let index = 0; index + 1 < road.points.length; index++) {
      if (isPointInSection(road.points[index], section.box) &&
          road.points[index].distanceToSquared(road.points[index + 1]) > 0) {
        indices.push(index);
      }
    }
    return indices.length ? [{ road, indices }] : [];
  });
}

function spawnCars(section) {
  for (const { road, indices } of section.spawnRoads.slice(0, numCars)) {
    const distantIndices = indices.filter(index => road.points[index].distanceToSquared(camera.position) > 900);
    const candidates = distantIndices.length ? distantIndices : indices;
    const currentIndex = candidates[Math.floor(Math.random() * candidates.length)];
    spawnCarOnRoad(road, currentIndex);
  }
}

function spawnCarOnRoad(road, currentIndex, startPos = road.points[currentIndex]) {
  const carMaterial = new THREE.MeshPhongMaterial({
    color: 0x0a0a1a,
    emissive: cyberpunkColors[Math.floor(Math.random() * cyberpunkColors.length)],
    emissiveIntensity: 1.5
  });
  const car = new THREE.Mesh(carGeometry, carMaterial);
  car.position.set(startPos.x, carElevation, startPos.z);
  const speed = carSpeed + Math.random() * 0.5;
  car.userData = {
    type: "car",
    road,
    currentIndex,
    dir: startPos === road.points[currentIndex] && currentIndex > 0 && Math.random() < 0.5 ? -1 : 1,
    speed,
    baseSpeed: speed,
    bounceVelocity: new THREE.Vector3()
  };
  const target = road.points[currentIndex + car.userData.dir];
  const moveDir = new THREE.Vector3().subVectors(target, car.position);
  car.rotation.y = Math.atan2(moveDir.x, moveDir.z) + Math.PI / 2;
  cars.push(car);
  scene.add(car);
}

function updateTransportSupply(step) {
  transportSupplyTimer -= step;
  if (transportSupplyTimer > 0) return;
  transportSupplyTimer = transportSupplyInterval;

  const { box, spawnRoads } = activeSection;
  const available = car => isPointInSection(car.position, box) && siteClear(car.position, 0);
  const remaining = cars.filter(available).length;
  if (remaining >= transportLowWatermark) return;

  const playerPosition = camera.position;
  const candidates = [];
  for (const { road, indices } of spawnRoads) {
    for (const index of indices) {
      const start = road.points[index];
      const midpoint = start.clone().lerp(road.points[index + 1], 0.5);
      for (const point of [start, midpoint]) {
        if (!isPointInSection(point, box)) continue;
        const distance = point.distanceToSquared(playerPosition);
        if (distance < 30 ** 2 || !siteClear(point, 2.5)) continue;
        candidates.push({ road, index, point, distance });
      }
    }
  }
  // Prefer arrivals a short way up the road, outside the player's immediate space.
  candidates.sort((a, b) => (a.distance < 90 ** 2) - (b.distance < 90 ** 2) ||
    a.distance - b.distance);

  const distantTraffic = cars.filter(car => car.position.distanceToSquared(playerPosition) > 300 ** 2 &&
    !available(car));
  let needed = transportRefillTarget - remaining;
  for (const { road, index, point } of candidates) {
    if (cars.some(car => car.position.distanceToSquared(point) < 18 ** 2)) continue;
    if (cars.length >= numCars) {
      const departing = distantTraffic.pop();
      if (!departing) break;
      disposeObjects([departing]);
      cars.splice(cars.indexOf(departing), 1);
    }
    spawnCarOnRoad(road, index, point);
    if (--needed === 0) break;
  }
}

function isPatrolSector() {
  return keysCollected === 1 || keysCollected >= 3;
}

function patrolRoute(section) {
  const { min, max } = section.box;
  const insetX = (max.x - min.x) * 0.2;
  const insetZ = (max.z - min.z) * 0.2;
  return [
    new THREE.Vector3(min.x + insetX, patrolAltitude, min.z + insetZ),
    new THREE.Vector3(max.x - insetX, patrolAltitude, min.z + insetZ),
    new THREE.Vector3(max.x - insetX, patrolAltitude, max.z - insetZ),
    new THREE.Vector3(min.x + insetX, patrolAltitude, max.z - insetZ)
  ];
}

function spawnSurveillancePatrol(route, startIndex = 0) {
  const airframe = new THREE.MeshPhongMaterial({ color: patrolSweepColor, emissive: patrolSweepColor, emissiveIntensity: 0.85 });
  const patrol = new THREE.Mesh(airplaneGeometry, airframe);
  const airframeScale = 1.6;
  patrol.scale.setScalar(airframeScale);

  const cone = new THREE.Mesh(
    new THREE.CylinderGeometry(0, patrolScanRadius, patrolAltitude, 28, 1, true),
    new THREE.MeshBasicMaterial({
      color: patrolSweepColor, side: THREE.DoubleSide, transparent: true, depthWrite: false, opacity: 0.12
    })
  );
  // Counter the airframe scale so the visible search area matches the sensor.
  cone.scale.setScalar(1 / airframeScale);
  cone.position.y = -patrolAltitude / (2 * airframeScale);
  const scanBand = new THREE.Mesh(
    new THREE.CylinderGeometry(1, 1, 1, 28, 1, true),
    glowMaterial(patrolSweepColor, 0)
  );
  patrol.add(cone, scanBand);

  patrol.position.copy(route[startIndex]);
  patrol.userData = {
    type: 'airplane',
    surveillance: {
      cone,
      scanBand,
      airframeScale,
      sweepPhase: 0,
      inCone: false,
      route,
      waypoint: (startIndex + 1) % route.length,
      timeUntilScan: patrolScanInterval,
      cueCooldown: 0,
      exposure: 0,
      hiddenTime: 0,
      reacquireTime: 0,
      groundContact: false,
      tracing: false,
      lastKnown: new THREE.Vector3(),
      linkedEnforcers: new Set()
    }
  };
  airplanes.push(patrol);
  scene.add(patrol);
  return patrol;
}

function surveillanceLineOfSight(origin, target) {
  const direction = new THREE.Vector3().subVectors(target, origin);
  const distance = direction.length();
  if (distance === 0) return true;
  const ray = new THREE.Raycaster(origin, direction.divideScalar(distance), 0, distance);
  return raycastBuildings(ray).length === 0;
}

function enforcerCanSee(enforcer, target, range) {
  if (enforcer.position.distanceToSquared(target) > range ** 2) return false;
  const eyes = enforcer.position.clone();
  eyes.y += 2;
  return surveillanceLineOfSight(eyes, target);
}

function reportEnforcerContact(enforcer, point) {
  const data = enforcer.userData;
  const pursuit = data.pursuit;
  if (pursuit) {
    pursuit.lastKnown.copy(point);
    pursuit.trailTime = enforcerTrailTime;
    pursuit.searchPoint = null;
    return;
  }
  data.pursuit = { lastKnown: point.clone(), trailTime: enforcerTrailTime, seeing: false, searchPoint: null, searchTime: 0 };
  data.sightTimer = 0;
  data.shootTimer = 0;
  const marker = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.85),
    new THREE.MeshBasicMaterial({ color: data.skimmerLinked ? patrolTraceColor : enforcerTraceColor })
  );
  marker.position.y = 3.8;
  marker.raycast = () => {};
  data.traceMarker = marker;
  enforcer.add(marker);
}

function alertEnforcersNear(origin, point = origin, excluded = null) {
  for (const enforcer of pedestrians) {
    if (enforcer !== excluded && !enforcer.userData.pursuit &&
        enforcer.position.distanceToSquared(origin) < pedestrianAlertDistance ** 2) {
      reportEnforcerContact(enforcer, point);
    }
  }
}

function findEnforcerSearchExit(enforcer, anchor) {
  const road = nearestRoadPoint(roads, anchor);
  const heading = road.direction ?? enforcer.userData.dir;
  const start = enforcer.position;
  const side = heading.x * enforcer.userData.dir.x + heading.z * enforcer.userData.dir.z < 0 ? -1 : 1;
  const exit = distance => checkBuildingCollisions(start, start.clone().addScaledVector(heading, distance), enforcer.userData.radius);
  const preferred = exit(side * 23);
  return preferred.distanceToSquared(start) > 12 ** 2 ? preferred : exit(-side * 23);
}

function updateEnforcerPursuit(enforcer, step) {
  const data = enforcer.userData;
  if (escapeBeam) reportEnforcerContact(enforcer, camera.position);
  data.sightTimer -= step;
  if (data.sightTimer <= 0) {
    const range = data.pursuit ? pedestrianAlertDistance : enforcerSpotDistance;
    const seeing = enforcerCanSee(enforcer, camera.position, range);
    if (seeing && !escapeBeam) reportEnforcerContact(enforcer, camera.position);
    data.sightTimer = enforcerSightInterval;
    if (data.pursuit) data.pursuit.seeing = seeing;
  }

  const pursuit = data.pursuit;
  if (!pursuit || pursuit.seeing || escapeBeam) return;
  if (!pursuit.searchPoint) {
    pursuit.trailTime -= step;
    const dx = pursuit.lastKnown.x - enforcer.position.x;
    const dz = pursuit.lastKnown.z - enforcer.position.z;
    if (dx * dx + dz * dz > 5 ** 2 && pursuit.trailTime > 0) return;
    pursuit.searchPoint = findEnforcerSearchExit(enforcer, pursuit.lastKnown);
    pursuit.searchTime = enforcerSearchTime;
  }
  pursuit.searchTime -= step;
  if (pursuit.searchTime <= 1e-8) {
    data.pursuit = null;
    data.pathState = null;
    if (data.traceMarker) {
      disposeObjects([data.traceMarker]);
      delete data.traceMarker;
    }
  }
}

function alertNearbyEnforcers(position, linked) {
  if (linked.size >= patrolLinkLimit) return;
  const nearby = [];
  for (const enforcer of pedestrians) {
    if (linked.has(enforcer)) continue;
    const distance = Math.hypot(enforcer.position.x - position.x, enforcer.position.z - position.z);
    if (distance <= patrolAlertRadius) nearby.push({ enforcer, distance });
  }
  nearby.sort((a, b) => a.distance - b.distance);
  for (const { enforcer } of nearby.slice(0, patrolLinkLimit - linked.size)) {
    linked.add(enforcer);
    enforcer.userData.skimmerLinked = true;
    reportEnforcerContact(enforcer, camera.position);
    enforcer.userData.traceMarker.material.color.setHex(patrolTraceColor);
  }
}

function scanFromPatrol(airplane, patrol) {
  if (!patrol.tracing && patrol.reacquireTime <= 0 && !isPatrolSector()) return;
  const player = camera.position;
  const position = airplane.position;
  const inCone = Math.hypot(player.x - position.x, player.z - position.z) <=
    patrolScanRadius * (position.y - player.y) / patrolAltitude;
  patrol.inCone = inCone;
  if (escapeBeam) return;
  const visible = inCone && surveillanceLineOfSight(position, player);
  patrol.cueCooldown = Math.max(0, patrol.cueCooldown - patrolScanInterval);
  if (inCone && patrol.cueCooldown === 0) {
    playSkimmerSweep();
    patrol.cueCooldown = 0.45;
  } else if (!inCone) {
    patrol.cueCooldown = 0;
  }

  if (!patrol.tracing) {
    if (patrol.reacquireTime > 0) {
      patrol.reacquireTime -= patrolScanInterval;
      if (patrol.reacquireTime > 1e-8) return;
      patrol.reacquireTime = 0;
      patrol.cone.visible = isPatrolSector();
      if (!patrol.cone.visible) return;
    }
    patrol.exposure = visible ? patrol.exposure + patrolScanInterval : 0;
    if (patrol.exposure + 1e-8 < patrolAcquireTime) return;
    patrol.tracing = true;
    patrol.cone.material.color.setHex(patrolTraceColor);
    patrol.scanBand.material.color.setHex(patrolTraceColor);
    showMessage("Skimmer has your signal. Exit the cone or break sight.");
  }

  for (const enforcer of patrol.linkedEnforcers) {
    if (!pedestrians.includes(enforcer)) patrol.linkedEnforcers.delete(enforcer);
  }

  patrol.groundContact = !visible && inCone && [...patrol.linkedEnforcers].some(enforcer => {
    const ground = enforcer.position;
    return Math.hypot(ground.x - position.x, ground.z - position.z) <= patrolRadioRadius &&
      enforcerCanSee(enforcer, player, pedestrianAlertDistance);
  });

  if (visible || patrol.groundContact) {
    patrol.lastKnown.copy(player);
    patrol.hiddenTime = 0;
    if (visible) alertNearbyEnforcers(position, patrol.linkedEnforcers);
    for (const enforcer of patrol.linkedEnforcers) reportEnforcerContact(enforcer, player);
    return;
  }

  patrol.hiddenTime += patrolScanInterval;
  if (patrol.hiddenTime + 1e-8 >= skimmerTraceTimeout(patrol)) {
    for (const enforcer of patrol.linkedEnforcers) {
      delete enforcer.userData.skimmerLinked;
      enforcer.userData.traceMarker?.material.color.setHex(enforcerTraceColor);
    }
    patrol.linkedEnforcers.clear();
    patrol.tracing = false;
    patrol.exposure = 0;
    patrol.hiddenTime = 0;
    patrol.reacquireTime = patrolReacquireDelay;
    patrol.searchAngle = Math.atan2(position.z - patrol.lastKnown.z, position.x - patrol.lastKnown.x);
    patrol.cone.material.color.setHex(patrolSweepColor);
    patrol.scanBand.material.color.setHex(patrolSweepColor);
    showMessage("Skimmer lost your signal. It’s sweeping where it last saw you.", 3000);
  }
}

function skimmerTraceTimeout(patrol) {
  return patrol.linkedEnforcers.size > 0 ? patrolLinkedLoseTime : patrolLoseTime;
}

function playSkimmerSweep() {
  if (audioCtx.state !== 'running') return;
  const start = audioCtx.currentTime;
  playSynthTone('sine', start, 0.46, 880, 659.25, 0.14, 0.045);
  playSynthTone('triangle', start + 0.055, 0.36, 1318.51, 880, 0.048, 0.035);
}

function updateSkimmerSweep(elapsed) {
  for (const airplane of airplanes) {
    const patrol = airplane.userData.surveillance;
    if (!patrol) continue;
    const { cone, scanBand, airframeScale } = patrol;
    scanBand.visible = cone.visible;
    if (!cone.visible) continue;
    patrol.sweepPhase = (patrol.sweepPhase + elapsed * (patrol.tracing ? 0.95 : 0.65)) % 1;
    const phase = patrol.sweepPhase;
    const pulse = Math.sin(Math.PI * phase);
    const radius = patrolScanRadius * phase / airframeScale;
    cone.material.opacity = (patrol.tracing ? 0.18 : 0.085) + 0.065 * pulse;
    scanBand.position.y = -patrolAltitude * phase / airframeScale;
    scanBand.scale.set(radius, 2.2 / airframeScale, radius);
    scanBand.material.opacity = pulse * (patrol.tracing ? 0.6 : 0.4);
  }
}

function startExtractionPursuit() {
  for (const enforcer of pedestrians) reportEnforcerContact(enforcer, camera.position);
  huntingPedestrians = pedestrians.length;

  const route = patrolRoute(activeSection);
  const ingress = route.map((point, index) => ({ index, distance: point.distanceToSquared(camera.position) }))
    .sort((a, b) => a.distance - b.distance);
  const skimmers = airplanes.filter(airplane => airplane.userData.surveillance);
  for (let index = 0; skimmers.length < extractionSkimmerCount; index++) {
    skimmers.push(spawnSurveillancePatrol(route, ingress[index].index));
  }
  skimmers.forEach((airplane, index) => {
    const patrol = airplane.userData.surveillance;
    patrol.tracing = true;
    patrol.hiddenTime = 0;
    patrol.reacquireTime = 0;
    patrol.lastKnown.copy(camera.position);
    patrol.extractionStandoff = skimmerFollowDistance + index * 16;
    patrol.sweepPhase = index / skimmers.length;
    patrol.cone.visible = true;
    patrol.cone.material.color.setHex(patrolTraceColor);
    patrol.scanBand.material.color.setHex(patrolTraceColor);
  });
}

function updateSurveillancePatrol(airplane, step) {
  const patrol = airplane.userData.surveillance;
  const position = airplane.position;
  const searching = !patrol.tracing && patrol.reacquireTime > 0;
  let target = escapeBeam ? camera.position : patrol.tracing ? patrol.lastKnown : patrol.route[patrol.waypoint];
  if (searching) {
    const angle = patrol.searchAngle + (patrolReacquireDelay - patrol.reacquireTime) * 0.5;
    target = patrol.lastKnown.clone();
    target.x += skimmerFollowDistance * Math.cos(angle);
    target.z += skimmerFollowDistance * Math.sin(angle);
  }
  const direction = new THREE.Vector3(target.x - position.x, 0, target.z - position.z);
  const distance = direction.length();
  const standoff = patrol.tracing ? patrol.extractionStandoff ?? skimmerFollowDistance : 0;
  if (distance > standoff) {
    const speed = patrol.tracing ? skimmerPursuitSpeed : skimmerPatrolSpeed;
    airplane.rotation.y = Math.atan2(direction.x, direction.z);
    direction.multiplyScalar(Math.min(speed * step, distance - standoff) / distance);
    const next = position.clone().add(direction);
    if (skimmerPositionIsOpen(next)) {
      position.copy(next);
    } else if (patrol.tracing || searching) {
      // Follow the edge of an unopened sector until the pursuit route is clear.
      next.z = position.z;
      if (skimmerPositionIsOpen(next)) position.x = next.x;
      next.x = position.x;
      next.z += direction.z;
      if (skimmerPositionIsOpen(next)) position.z = next.z;
    }
  } else if (!patrol.tracing && !searching) {
    patrol.waypoint = (patrol.waypoint + 1) % patrol.route.length;
  }

  patrol.timeUntilScan -= step;
  if (patrol.timeUntilScan <= 0) {
    patrol.timeUntilScan += patrolScanInterval;
    scanFromPatrol(airplane, patrol);
  }
}

function skimmerPositionIsOpen(point) {
  for (const section of sections.values()) {
    if (isPointInSection(point, section.box)) return true;
  }
  return false;
}

const roadNodeCells = new Map();

function rebuildRoadIndex() {
  roadNodeCells.clear();
  for (const road of roads) {
    road.points.forEach((point, index) => {
      const key = sectionKey(Math.floor(point.x / buildingCellSize), Math.floor(point.z / buildingCellSize));
      if (!roadNodeCells.has(key)) roadNodeCells.set(key, []);
      roadNodeCells.get(key).push({ road, index, point });
    });
  }
}

function chooseNewRoad(obj, distance) {
  const position = obj.position;
  const distanceSquared = distance * distance;
  const currentRoad = obj.userData.road;
  const candidates = [];
  for (let x = Math.floor((position.x - distance) / buildingCellSize);
       x <= Math.floor((position.x + distance) / buildingCellSize); x++) {
    for (let z = Math.floor((position.z - distance) / buildingCellSize);
         z <= Math.floor((position.z + distance) / buildingCellSize); z++) {
      const cell = roadNodeCells.get(sectionKey(x, z));
      if (!cell) continue;
      for (const node of cell) {
        if (node.road !== currentRoad && node.point.distanceToSquared(position) < distanceSquared) {
          candidates.push(node);
        }
      }
    }
  }
  if (candidates.length === 0) return null;
  const { road, index } = candidates[Math.floor(Math.random() * candidates.length)];
  const dir = index === 0 || (index < road.points.length - 1 && Math.random() < 0.5) ? 1 : -1;
  return { road, index, dir };
}

function buildCollisionEdges(points) {
  let signedArea = 0;
  const origin = points[0];
  for (let i = 1; i + 1 < points.length; i++) {
    const a = points[i];
    const b = points[i + 1];
    signedArea += (a.x - origin.x) * (b.z - origin.z) - (a.z - origin.z) * (b.x - origin.x);
  }
  const winding = Math.sign(signedArea) || 1;
  const edges = [];
  for (let i = 0; i < points.length; i++) {
    const { x, z } = points[i];
    const end = points[(i + 1) % points.length];
    const dx = end.x - x;
    const dz = end.z - z;
    const length = Math.hypot(dx, dz);
    if (length === 0) continue;
    const tx = dx / length;
    const tz = dz / length;
    edges.push({ x, z, tx, tz, length, nx: winding * tz, nz: -winding * tx });
  }
  return edges;
}

const collisionEpsilon = 1e-5;

// Sweep a circle against the sides and vertices of each nearby footprint.
function firstMovementContact(position, move, radius) {
  const endX = position.x + move.x;
  const endZ = position.z + move.z;
  const lengthSquared = move.lengthSq();
  const candidates = buildingsInBounds(
    Math.min(position.x, endX) - radius, Math.min(position.z, endZ) - radius,
    Math.max(position.x, endX) + radius, Math.max(position.z, endZ) + radius
  );
  let contact = null;
  let timeLimit = 1;
  for (const building of candidates) {
    const { box, collisionEdges } = building.userData;
    if (position.y < box.min.y - collisionEpsilon || position.y > box.max.y + collisionEpsilon) continue;
    for (const edge of collisionEdges) {
      const x = position.x - edge.x;
      const z = position.z - edge.z;
      const distance = x * edge.nx + z * edge.nz;
      const approach = move.x * edge.nx + move.z * edge.nz;
      if (approach < -collisionEpsilon && distance >= -collisionEpsilon) {
        const time = Math.max(0, (radius - distance) / approach);
        if (time <= timeLimit) {
          const along = (x + move.x * time) * edge.tx + (z + move.z * time) * edge.tz;
          if (along >= 0 && along <= edge.length) {
            contact = { time, nx: edge.nx, nz: edge.nz };
            timeLimit = time;
          }
        }
      }

      const dot = x * move.x + z * move.z;
      if (dot >= 0) continue;
      const discriminant = dot * dot - lengthSquared * (x * x + z * z - radius * radius);
      if (discriminant < 0) continue;
      const time = Math.max(0, (-dot - Math.sqrt(discriminant)) / lengthSquared);
      if (time > timeLimit) continue;
      const hitX = x + move.x * time;
      const hitZ = z + move.z * time;
      const length = Math.hypot(hitX, hitZ);
      if (length > collisionEpsilon) {
        contact = { time, nx: hitX / length, nz: hitZ / length };
        timeLimit = time;
      }
    }
  }
  return contact;
}

function checkBuildingCollisions(currentPos, nextPos, radius) {
  const position = currentPos.clone();
  const move = new THREE.Vector3(nextPos.x - currentPos.x, 0, nextPos.z - currentPos.z);
  // Recheck the remaining slide after each contact so it can't cross a second wall.
  for (let remainingContacts = 3;
       remainingContacts > 0 && move.lengthSq() > collisionEpsilon * collisionEpsilon; remainingContacts--) {
    const hit = firstMovementContact(position, move, radius);
    if (!hit) return position.add(move);
    position.addScaledVector(move, hit.time);
    position.x += hit.nx * collisionEpsilon;
    position.z += hit.nz * collisionEpsilon;
    move.multiplyScalar(1 - hit.time);
    const inward = Math.min(0, move.x * hit.nx + move.z * hit.nz);
    move.x -= hit.nx * inward;
    move.z -= hit.nz * inward;
  }
  return position;
}

function findPathAroundBuilding(ped, targetPos) {
    const currentPos = ped.position.clone();
    const directDir = new THREE.Vector3(targetPos.x - currentPos.x, 0, targetPos.z - currentPos.z).normalize();
    const step = ped.userData.speed;
    
    // Initialize pedestrian state if needed
    if (!ped.userData.pathState) {
        ped.userData.pathState = {
            currentWallDir: null,
            stuckTime: 0,
            lastPos: currentPos.clone(),
            preferredSide: Math.random() < 0.5 ? 1 : -1,
            switchDirTimer: 0
        };
    }

    const state = ped.userData.pathState;

    // Check if we're stuck
    if (currentPos.distanceTo(state.lastPos) < step * 0.1) {
        state.stuckTime++;
        if (state.stuckTime > 30) { // Half second at 60fps
            state.preferredSide *= -1; // Switch wall-following direction
            state.stuckTime = 0;
            state.currentWallDir = null;
        }
    } else {
        state.stuckTime = 0;
        state.lastPos.copy(currentPos);
    }

    // Cast rays to detect walls
    const rayDirections = [
        directDir,
        directDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI * 0.25),
        directDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI * 0.25),
        directDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI * 0.5),
        directDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI * 0.5)
    ];

    let closestWall = Infinity;
    let closestNormal = null;
    let hasLineOfSight = true;

    for (const dir of rayDirections) {
        const ray = new THREE.Raycaster(currentPos, dir, 0, 10);
        const intersects = raycastBuildings(ray);
        
        if (intersects.length > 0) {
            if (dir.equals(directDir)) {
                hasLineOfSight = false;
            }
            if (intersects[0].distance < closestWall) {
                closestWall = intersects[0].distance;
                closestNormal = intersects[0].face.normal.clone()
                    .applyQuaternion(intersects[0].object.quaternion);
            }
        }
    }

    // If we have line of sight and no close walls, go directly to target
    if (hasLineOfSight && closestWall > step * 2) {
        state.currentWallDir = null;
        return directDir.multiplyScalar(step);
    }

    // If we hit a wall, follow it
    if (closestNormal) {
        // Get perpendicular direction to wall
        const perpDir = new THREE.Vector3(-closestNormal.z, 0, closestNormal.x).normalize();
        
        // If we don't have a current wall direction or we're stuck, choose one
        if (!state.currentWallDir) {
            state.currentWallDir = perpDir.clone().multiplyScalar(state.preferredSide);
        }

        // Try to move along the wall while staying at a good distance
        const idealDist = step * 2;
        const distanceAdjust = closestWall < idealDist ?
            closestNormal.clone().multiplyScalar(step * 0.5) :
            new THREE.Vector3();

        // Blend between wall following and target direction
        const moveDir = state.currentWallDir.clone();
        if (hasLineOfSight) {
            moveDir.lerp(directDir, 0.5);
        }
        moveDir.normalize();

        // Check if the proposed direction is clear
        const proposedMove = moveDir.multiplyScalar(step).add(distanceAdjust);
        const travel = proposedMove.length();
        if (travel > step) proposedMove.multiplyScalar(step / travel);
        const checkRay = new THREE.Raycaster(currentPos, proposedMove.clone().normalize(), 0, Math.min(travel, step));
        const moveIntersects = raycastBuildings(checkRay);

        if (moveIntersects.length === 0) {
            return proposedMove;
        }

        // If proposed move hits a wall, try the opposite wall direction
        state.switchDirTimer++;
        if (state.switchDirTimer > 20) { // Switch direction if we've been blocked for a while
            state.preferredSide *= -1;
            state.currentWallDir.multiplyScalar(-1);
            state.switchDirTimer = 0;
        }

        // Try moving directly away from wall as last resort
        if (closestWall < step) {
            return closestNormal.multiplyScalar(step);
        }
    }

    // If all else fails, try to move in a random direction
    if (state.stuckTime > 15) {
        const randomAngle = Math.random() * Math.PI * 2;
        const randomDir = new THREE.Vector3(Math.cos(randomAngle), 0, Math.sin(randomAngle));
        return randomDir.multiplyScalar(step * 0.5);
    }

    return new THREE.Vector3();
}

      const collisionThreshold = 6;
      for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
          if (cars[i] && cars[j] && cars[i].position.distanceTo(cars[j].position) < collisionThreshold) {
            const dirI = cars[i].userData.dir;
            const dirJ = cars[j].userData.dir;
            cars[i].userData.dir = -dirI;

            const avoidDir = new THREE.Vector3().subVectors(cars[i].position, cars[j].position).normalize();
            cars[i].userData.bounceVelocity.add(avoidDir.multiplyScalar(1));
            cars[j].userData.bounceVelocity.add(avoidDir.multiplyScalar(-1));

            cars[i].userData.speed = cars[i].userData.baseSpeed;
            cars[j].userData.speed = cars[j].userData.baseSpeed;

            const nextIdxI = cars[i].userData.currentIndex + cars[i].userData.dir;
            if (nextIdxI >= 0 && nextIdxI < cars[i].userData.road.points.length) {

            const noiseTime = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let j = 0; j < bufferSize; j++) {
                data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.5));
            }
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(1.0, noiseTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, noiseTime + 0.3);
            noiseSource.connect(noiseGain).connect(effectsBus);
            noiseSource.start(noiseTime);
            noiseSource.stop(noiseTime + 0.3);
            trackAudioSource(noiseSource);

            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(40, noiseTime);
            osc.frequency.exponentialRampToValueAtTime(20, noiseTime + 1);
            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0.8, noiseTime);
            oscGain.gain.exponentialRampToValueAtTime(0.001, noiseTime + 1);
            osc.connect(oscGain).connect(effectsBus);
            osc.start(noiseTime);
            osc.stop(noiseTime + 1);
            trackAudioSource(osc);
        }).catch(err => {
            console.error("Failed to resume audio context for death sound:", err);
        });
    }

function blocksObjectiveSite(building, point, radius) {
  const { min, max } = building.userData.box;
  return min.y <= playerHeight && max.y >= 0 &&
    point.x + radius > min.x && point.x - radius < max.x &&
    point.z + radius > min.z && point.z - radius < max.z;
}

function siteClear(point, radius) {
  const nearby = buildingsInBounds(point.x - radius, point.z - radius, point.x + radius, point.z + radius);
  return ![...nearby].some(building => blocksObjectiveSite(building, point, radius));
}

function streetObjective(availableRoads, bounds, desired, radius, acceptSite = () => true) {
  const usable = point => siteClear(point, radius) && acceptSite(point);
  const junctions = new Map();
  for (const road of availableRoads) {
    road.points.forEach((point, index) => {
      if (!isPointInSection(point, bounds)) return;
      const key = sectionKey(Math.round(point.x / 2), Math.round(point.z / 2));
      if (!junctions.has(key)) junctions.set(key, { point, directions: new Set() });
      const { directions } = junctions.get(key);
      for (const neighbor of [road.points[index - 1], road.points[index + 1]]) {
        if (!neighbor || point.distanceToSquared(neighbor) < 1) continue;
        const angle = Math.atan2(neighbor.z - point.z, neighbor.x - point.x);
        directions.add((Math.round(angle / (Math.PI / 4)) + 8) % 8);
      }
    });
  }

  const ordered = [...junctions.values()]
    .map(node => ({ ...node, distance: node.point.distanceToSquared(desired) }))
    .sort((a, b) => a.distance - b.distance);
  // Prefer a real junction near the desired spot; avoid distant detours on sparse maps.
  const local = Math.min(bounds.max.x - bounds.min.x, bounds.max.z - bounds.min.z) / 3;
  const crossing = ordered.find(node => node.distance <= local * local &&
    node.directions.size >= 3 && usable(node.point));
  if (crossing) return crossing.point.clone();
  const roadPoint = ordered.find(node => node.directions.size > 0 && usable(node.point));
  if (roadPoint) return roadPoint.point.clone();

  // A sparse city may have no usable junction or road vertex in this section.
  if (usable(desired)) return desired.clone();
  let closest = null;
  let distance = Infinity;
  for (let x = bounds.min.x + 12; x < bounds.max.x; x += 24) {
    for (let z = bounds.min.z + 12; z < bounds.max.z; z += 24) {
      const point = new THREE.Vector3(x, 0, z);
      const nextDistance = point.distanceToSquared(desired);
      if (nextDistance < distance && usable(point)) {
        closest = point;
        distance = nextDistance;
      }
    }
  }
  return closest;
}

function nearestRoadPoint(roads, point) {
  let nearest = null;
  let direction = null;
  let distanceSquared = Infinity;
  for (const road of roads) {
    for (let i = 1; i < road.points.length; i++) {
      const start = road.points[i - 1];
      const end = road.points[i];
      const dx = end.x - start.x;
      const dz = end.z - start.z;
      const lengthSquared = dx * dx + dz * dz;
      if (lengthSquared === 0) continue;
      const offset = ((point.x - start.x) * dx + (point.z - start.z) * dz) / lengthSquared;
      const t = Math.max(0, Math.min(1, offset));
      const x = start.x + t * dx;
      const z = start.z + t * dz;
      const distance = (point.x - x) ** 2 + (point.z - z) ** 2;
      if (distance < distanceSquared) {
        distanceSquared = distance;
        nearest = new THREE.Vector3(x, 0, z);
        const length = Math.sqrt(lengthSquared);
        direction = new THREE.Vector3(dx / length, 0, dz / length);
      }
    }
  }
  return { point: nearest, distanceSquared, direction };
}

function findOffRoadSpawn(section) {
  const { box, roads } = section;
  const center = box.getCenter(new THREE.Vector3());
  center.y = 0;
  const junction = streetObjective(roads, box, center, 5) ?? center;
  let compactSite = null;

  function checkSite(point) {
    if (!isPointInSection(point, box) || !siteClear(point, 5)) return null;
    const road = nearestRoadPoint(roads, point);
    if (!road.point || !isPointInSection(road.point, box) ||
        road.distanceSquared < 12 ** 2 || road.distanceSquared > 75 ** 2) return null;

    const start = point.clone();
    start.y = road.point.y = playerHeight;
    const exit = checkBuildingCollisions(start, road.point, playerRadius);
    if (exit.distanceToSquared(road.point) > 0.01) return null;

    if (siteClear(point, escapeRadius)) return { point, radius: escapeRadius };
    if (!compactSite) compactSite = { point, radius: 5 };
    return null;
  }

  // Prefer a clear pocket at the central junction with a walkable approach to a road.
  for (let distance = 0; distance <= 72; distance += 6) {
    const samples = distance === 0 ? 1 : 16;
    for (let index = 0; index < samples; index++) {
      const angle = index * Math.PI * 2 / samples;
      const point = new THREE.Vector3(junction.x + distance * Math.cos(angle), 0,
        junction.z + distance * Math.sin(angle));
      const site = checkSite(point);
      if (site) return site;
    }
  }
  if (compactSite) return compactSite;

  let closest = null;
  let closestDistance = Infinity;
  for (let x = box.min.x + 12; x < box.max.x; x += 24) {
    for (let z = box.min.z + 12; z < box.max.z; z += 24) {
      const point = new THREE.Vector3(x, 0, z);
      const distance = point.distanceToSquared(center);
      if (distance >= closestDistance) continue;
      const site = checkSite(point);
      if (site) {
        closest = site;
        closestDistance = distance;
      }
    }
  }
  return closest ?? compactSite;
}

function createVaultBeacon() {
  const height = 60;
  const lowerRadius = 8;
  const upperRadius = 1.5;
  const sides = 6;
  const beacon = new THREE.Group();
  const shell = new THREE.Mesh(
    new THREE.CylinderGeometry(upperRadius, lowerRadius, height, sides),
    glowMaterial(vaultBeaconColor, 0.18)
  );
  shell.position.y = height / 2;
  const spine = new THREE.Mesh(
    new THREE.CylinderGeometry(0.6, 1.25, height - 9, sides, 1, true),
    glowMaterial(0xffe4b0, 0.3)
  );
  spine.position.y = (height + 9) / 2;

  const base = new THREE.Mesh(
    new THREE.RingGeometry(8.4, 9.1, sides),
    glowMaterial(vaultBeaconColor, 0.6)
  );
  base.rotation.x = -Math.PI / 2;
  base.position.y = 0.12;

  const sweepGeometry = new THREE.CylinderGeometry(1, 1, 1, sides, 1, true);
  const sweeps = Array.from({ length: 3 }, () =>
    new THREE.Mesh(sweepGeometry, glowMaterial(vaultBeaconColor, 0))
  );
  beacon.add(shell, spine, base, ...sweeps);
  beacon.userData = { shell, spine, base, sweeps, height, lowerRadius, upperRadius, phase: 0 };
  return beacon;
}

function updateVaultBeacon(elapsed) {
  if (!dataVault) return;
  const { core, beacon } = dataVault.userData;
  if (!dataVault.visible && vaultSiteOutOfSight(dataVault.position, camera.getWorldDirection(new THREE.Vector3()))) {
    dataVault.visible = true;
  }
  const effect = beacon.userData;
  const ready = charge >= fullCharge;
  effect.phase = (effect.phase + elapsed * (ready ? 0.8 : 0.46)) % 1;
  const pulse = 0.5 - 0.5 * Math.cos(effect.phase * Math.PI * 2);
  core.rotation.y += elapsed * 0.65;
  effect.shell.material.opacity = (ready ? 0.22 : 0.13) + pulse * 0.06;
  effect.spine.material.opacity = (ready ? 0.52 : 0.24) + pulse * 0.14;
  effect.base.material.opacity = 0.5 + pulse * 0.3;
  effect.sweeps.forEach((sweep, index) => {
    const progress = (effect.phase + index / effect.sweeps.length) % 1;
    const y = 3 + (effect.height - 6) * progress;
    const radius = effect.lowerRadius + (effect.upperRadius - effect.lowerRadius) * y / effect.height;
    sweep.position.y = y;
    sweep.scale.set(radius + 0.15, 1.3, radius + 0.15);
    sweep.material.opacity = (ready ? 0.8 : 0.55) * Math.sin(Math.PI * progress);
  });
}

function findVaultSite(section) {
  const { box, x, z, roads: sectionRoads } = section;
  const desired = box.getCenter(new THREE.Vector3());
  desired.y = 0;
  const next = arenaRoute[keysCollected + 1];
  const size = box.getSize(new THREE.Vector3());
  if (next) {
    desired.x -= (next.x - x) * size.x * 0.32;
    desired.z += (next.z - z) * size.z * 0.32;
  } else {
    // Put the final vault toward the outside corner so extraction is a return trip.
    desired.x -= Math.sign(x) * size.x * 0.32;
    desired.z += Math.sign(z) * size.z * 0.32;
  }
  const forward = camera.getWorldDirection(new THREE.Vector3());
  const distant = point => point.distanceToSquared(camera.position) > 120 ** 2;
  const concealed = point => distant(point) && vaultSiteOutOfSight(point, forward);
  return streetObjective(sectionRoads, box, desired, 9, concealed) ??
    streetObjective(sectionRoads, box, desired, 9, distant) ??
    streetObjective(sectionRoads, box, desired, 9) ??
    streetObjective(sectionRoads, box, desired, 3);
}

function vaultSiteOutOfSight(point, forward) {
  // Enclose the full beacon so an off-screen core cannot leave the cone in view.
  const toCenter = new THREE.Vector3(point.x - camera.position.x, 30 - camera.position.y,
    point.z - camera.position.z);
  const distance = toCenter.length();
  if (distance <= 32) return false;
  const halfDiagonal = Math.atan(Math.tan(camera.fov * Math.PI / 360) * Math.hypot(1, camera.aspect));
  const margin = Math.asin(32 / distance);
  const facing = (toCenter.x * forward.x + toCenter.y * forward.y + toCenter.z * forward.z) / distance;
  if (facing < Math.cos(halfDiagonal + margin)) return true;

  const widthAxis = new THREE.Vector3(toCenter.z, 0, -toCenter.x).normalize();
  return [[0, 60], [-5, 30], [0, 30], [5, 30], [-8, 3], [0, 3], [8, 3]].every(([offset, y]) => {
    const direction = new THREE.Vector3(toCenter.x, y - camera.position.y, toCenter.z)
      .addScaledVector(widthAxis, offset);
    const range = direction.length();
    if (range === 0) return false;
    const ray = new THREE.Raycaster(camera.position, direction.multiplyScalar(1 / range), 0, range);
    return raycastBuildings(ray, isSolidBuilding).length > 0;
  });
}

function placeDataVault() {
  let point = findVaultSite(activeSection);
  if (!point) {
    const { x, z } = activeSection;
    const bounds = sectionBounds(x, z);
    activateSection(buildMapSection(x, z, bounds.box, generateMapData(x, z, bounds)));
    point = findVaultSite(activeSection);
  }
  if (!point) throw new Error("No clear street position for the data vault");

  activeSection.vaultSite = point.clone();
  dataVault = new THREE.Group();
  dataVault.position.copy(point);
  dataVault.visible = vaultSiteOutOfSight(point, camera.getWorldDirection(new THREE.Vector3()));
  const core = new THREE.Mesh(
    new THREE.DodecahedronGeometry(4.5),
    new THREE.MeshBasicMaterial({ color: vaultBeaconColor, wireframe: true })
  );
  core.position.y = playerHeight + 1;
  const beacon = createVaultBeacon();
  dataVault.userData = { core, beacon, shotTargets: [core, beacon.userData.shell] };
  dataVault.add(core, beacon);
  updateVaultBeacon(0);
  scene.add(dataVault);
  dataVault.updateMatrixWorld(true);
}

function updateArenaStatus() {
  const target = escapeBeam?.userData.site;
  const distance = target ? Math.ceil(Math.hypot(camera.position.x - target.x, camera.position.z - target.z) / 10) * 10 : 0;
  const vaultReady = dataVault && camera.position.distanceToSquared(dataVault.position) <= vaultRange ** 2;
  const phase = escaped ? "Extraction complete" : escapeBeam ? "Reach the extraction beam" :
    droppedKey ? "Pick up the encryption key" :
    dataVault?.visible === false ? "Vault pending · Look away or move" :
    charge >= fullCharge ? (vaultReady ? "Vault in range · Fire" : "Vault ready · Move closer") :
      "Breach data transports to fill the buffer";
  const keyCount = "KEYS " + keysCollected + "/" + arenaRoute.length;
  const label = keyCount + " · " + phase + (target && !escaped ? " · " + distance + " m" : "");
  const heat = "SUPERVISOR HEAT " + Math.floor(moonHeat) + "%" +
    (moonAttack?.phase === "lock" ? " · LOCKED · CLEAR THE RED RING" :
      moonAttack?.phase === "track" ? " · TRACKING SIGNAL" : "");
  if (arenaObjective.textContent !== label) arenaObjective.textContent = label;
  const hack = isFreeFly ? "HACK LIVE · BUFFER −" + (hackMoving ? 4 : 2) + "%/s" : "";
  if (hackStatus.textContent !== hack) hackStatus.textContent = hack;
  if (moonStatus.textContent !== heat) moonStatus.textContent = heat;
  const patrol = !isDead && !escaped ? airplanes[0]?.userData.surveillance : null;
  let trace = "";
  if (escapeBeam && !isDead && !escaped) {
    trace = "SKIMMER TRACE · GRIDWIDE";
  } else if (patrol?.tracing) {
    const remaining = skimmerTraceTimeout(patrol) - patrol.hiddenTime;
    const cue = patrol.hiddenTime > 0 ? "STAY DARK " + remaining.toFixed(1) + " s" :
      patrol.groundContact ? "GROUND RELAY ACTIVE · BREAK SIGHT" : "EXIT THE CONE OR BREAK SIGHT";
    trace = "SKIMMER TRACE · " + cue;
  } else if (patrol?.inCone && patrol.cone.visible) {
    trace = patrol.reacquireTime > 0 ? "SKIMMER SEARCH · STAY DARK" : "SKIMMER SWEEP · GET UNDER COVER";
  }
  if (patrolStatus.textContent !== trace) patrolStatus.textContent = trace;
  const enforcement = isDead || escaped || huntingPedestrians === 0 ? "" :
    escapeBeam ? "ENFORCER TRACE · GRIDWIDE" : sightedEnforcers > 0 ?
    "ENFORCER TRACE · VISUAL ×" + sightedEnforcers :
    patrol?.tracing && patrol.hiddenTime === 0 && patrol.linkedEnforcers.size > 0 ?
      "ENFORCER TRACE · SKIMMER RELAY" : "ENFORCER TRACE · CHECKING LAST CONTACT";
  if (enforcerStatus.textContent !== enforcement) enforcerStatus.textContent = enforcement;
}

function raiseMoonAlert() {
  moonHeat = Math.max(moonHeat, keysCollected * 8);
  updateArenaStatus();
}

function glowMaterial(color, opacity) {

  });
}
