function updateEscapeBeam(elapsed) {
  if (!escapeBeam) return;
  const effect = escapeBeam.userData;
  effect.phase = (effect.phase + elapsed * 0.4) % 1;
  effect.haze.opacity = 0.12 + 0.05 * (1 - Math.cos(effect.phase * Math.PI * 2));
  effect.bands.forEach((band, index) => {
    const progress = (effect.phase + index / effect.bands.length) % 1;
    const width = 16 + 30 * progress;
    band.position.y = 24 + (effect.height - 48) * progress;
    band.scale.set(width, 40 + progress * 24, width);
    band.material.opacity = 0.64 * Math.sin(progress * Math.PI);
  });
}

function decryptSectorBuildings(section, origin) {
  finishDecryptionWave();
  const footprint = [];
  const meshSignals = [];
  let extent = 1;
  for (const building of section.buildings) {
    if (building.userData.isCleared) continue;
    const oldMaterial = building.material;
    building.material = new THREE.MeshBasicMaterial({
      color: oldMaterial.emissive || 0x111111,
      wireframe: true
    });
    oldMaterial.dispose();
    building.userData.isCleared = true;
    const center = building.userData.box.getCenter(new THREE.Vector3());
    const distance = Math.hypot(center.x - origin.x, center.z - origin.z);
    extent = Math.max(extent, distance);
    meshSignals.push({ material: building.material, color: building.material.color.clone(), distance });
    for (const { x, z, tx, tz, length } of building.userData.collisionEdges) {
      appendGroundStrip(footprint, x, z, x + tx * length, z + tz * length, 0.8, 0.09);
    }
  }
  if (footprint.length > 0) section.group.add(groundOverlay(footprint, 0x91a7ff));
  decryptionWave = { meshSignals, extent, age: 0, pulseColor: new THREE.Color(0xa4ffec) };
}

function finishDecryptionWave() {
  if (!decryptionWave) return;
  for (const { material, color } of decryptionWave.meshSignals) material.color.copy(color);
  decryptionWave = null;
}

function updateDecryptionWave(elapsed) {
  if (!decryptionWave) return;
  decryptionWave.age += elapsed;
  if (decryptionWave.age >= 1.15) {
    finishDecryptionWave();
    return;
  }
  const { meshSignals, extent, age, pulseColor } = decryptionWave;
  const band = extent * (age * 1.45 - 0.12);
  const width = Math.max(25, extent * 0.16);
  for (const { material, color, distance } of meshSignals) {
    const glow = Math.max(0, 1 - Math.abs(distance - band) / width);
    material.color.copy(color).lerp(pulseColor, glow * 0.95);
  }
}

function fractureVault() {
  const origin = dataVault.position.clone();
  if (vaultBurst) disposeObjects([vaultBurst.group]);
  disposeObjects([dataVault]);
  dataVault = null;

  const group = new THREE.Group();
  group.position.copy(origin);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.93, 1, 48), glowMaterial(0xffd583, 0.9));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.16;
  const flash = new THREE.Mesh(
    new THREE.CylinderGeometry(1.8, 5, 1, 6, 1, true),
    glowMaterial(0xffe9ab, 0.8)
  );
  const geometry = new THREE.BufferGeometry();
  const position = new THREE.BufferAttribute(new Float32Array(60 * 3), 3);
  geometry.setAttribute('position', position);
  const shards = new THREE.Points(geometry, new THREE.PointsMaterial({
    color: 0xffda8a,
    size: 2.6,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  shards.frustumCulled = false;
  const velocity = [];
  for (let i = 0; i < position.array.length; i += 3) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 12 + Math.random() * 47;
    velocity.push(Math.cos(angle) * speed, 14 + Math.random() * 43, Math.sin(angle) * speed);
  }
  group.add(ring, flash, shards);
  scene.add(group);
  vaultBurst = { group, ring, flash, shards, position, velocity, age: 0 };
  updateVaultBurst(0);
  playVaultFracture();
  return origin;
}

function updateDroppedKey(elapsed) {

function updateKeyPickup(step) {

function takeDroppedKey() {

function updateVaultBurst(elapsed) {
  if (!vaultBurst) return;
  const { group, ring, flash, shards, position, velocity } = vaultBurst;
  vaultBurst.age += elapsed;
  const age = vaultBurst.age;
  const progress = age / 1.1;
  if (progress >= 1) {
    disposeObjects([group]);
    vaultBurst = null;
    return;
  }
  const fade = 1 - progress;
  ring.scale.setScalar(4 + 58 * (1 - fade ** 3));
  ring.material.opacity = 0.9 * fade ** 1.8;
  flash.scale.y = 24 + 68 * progress;
  flash.position.y = flash.scale.y / 2;
  flash.material.opacity = 0.8 * fade ** 5;
  shards.material.opacity = fade;
  for (let i = 0; i < velocity.length; i += 3) {
    position.array[i] = velocity[i] * age;
    position.array[i + 1] = Math.max(0.2, 6 + velocity[i + 1] * age - 30 * age * age);
    position.array[i + 2] = velocity[i + 2] * age;
  }
  position.needsUpdate = true;
}

function clearMoonStrike(keepBlast = false) {
  moonAttack = null;

}

function createMoonBlast() {
  const root = new THREE.Group();
  const column = new THREE.Group();
  const beamLayers = [
    { top: 7, base: 5, color: 0xffeee2, opacity: 0.95 },
    { top: 19, base: 15, color: 0xff3421, opacity: 0.82 },
    { top: 41, base: moonStrikeRadius, color: 0xff002a, opacity: 0.4 }
  ].map(({ top, base, color, opacity }) => {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(top, base, 1, 28, 1, true), glowMaterial(color, opacity));
    column.add(mesh);
    return { mesh, opacity };
  });

  const impact = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), glowMaterial(0xff5a27, 0.6));
  impact.position.y = 1;
  const shockwave = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 64), glowMaterial(0xff8a54, 0.9));
  shockwave.rotation.x = -Math.PI / 2;
  shockwave.position.y = 0.08;

  const sparkGeometry = new THREE.BufferGeometry();
  const sparks = new THREE.BufferAttribute(new Float32Array(72 * 3), 3);
  sparkGeometry.setAttribute('position', sparks);
  const debris = new THREE.Points(sparkGeometry, new THREE.PointsMaterial({
    color: 0xffa556,
    size: 2.2,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  debris.frustumCulled = false;
  const sparkVelocities = new Float32Array(sparks.array.length);

  root.add(column, impact, shockwave, debris);
  root.visible = false;
  scene.add(root);
  return { root, column, beamLayers, impact, shockwave, sparks, debris, sparkVelocities, age: 0 };
}

function fireMoonBlast(target, radius = moonStrikeRadius) {
  if (!moonBlast) moonBlast = createMoonBlast();
  const { root, column, sparkVelocities } = moonBlast;
  moonBlast.age = 0;
  moonBlast.radius = radius;
  root.position.copy(target);
  const toSupervisor = sun.position.clone().sub(target);
  column.position.copy(toSupervisor).multiplyScalar(0.5);
  column.scale.y = toSupervisor.length();
  column.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), toSupervisor.normalize());

  for (let i = 0; i < sparkVelocities.length; i += 3) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 12 + Math.random() * 35;
    sparkVelocities[i] = Math.cos(angle) * speed;
    sparkVelocities[i + 1] = 12 + Math.random() * 46;
    sparkVelocities[i + 2] = Math.sin(angle) * speed;
  }
  root.visible = true;
  updateMoonBlast(0);
}

function updateMoonBlast(elapsed) {
  if (!moonBlast?.root.visible) return;
  const { root, beamLayers, impact, shockwave, sparks, debris, sparkVelocities, radius } = moonBlast;
  moonBlast.age += elapsed;
  const age = moonBlast.age;
  const progress = Math.min(1, age / 0.7);
  if (progress === 1) {
    root.visible = false;
    return;
  }

  const columnFade = Math.max(0, 1 - age / 0.46);
  for (const { mesh, opacity } of beamLayers) {
    mesh.visible = columnFade > 0;
    mesh.material.opacity = opacity * columnFade;
    mesh.scale.x = mesh.scale.z = (0.55 + 0.45 * columnFade) * radius / moonStrikeRadius;
  }

  const expansion = 1 - (1 - progress) ** 3;
  shockwave.scale.setScalar(2 + (radius - 2) * expansion);
  shockwave.material.opacity = 0.95 * (1 - progress);
  impact.scale.set(4 + 12 * expansion, 5 + 17 * expansion, 4 + 12 * expansion);
  impact.material.opacity = 0.73 * (1 - progress) ** 2;
  debris.material.opacity = 1 - progress;
  for (let i = 0; i < sparks.array.length; i += 3) {
    sparks.array[i] = sparkVelocities[i] * age;
    sparks.array[i + 1] = Math.max(0.15, sparkVelocities[i + 1] * age - 36 * age * age);
    sparks.array[i + 2] = sparkVelocities[i + 2] * age;
  }
  sparks.needsUpdate = true;
}

function updateMoon(step) {
  if (keysCollected < 2) return;
  const extracting = Boolean(escapeBeam);
  if (extracting) moonHeat = Math.min(100, moonHeat + 5 * step);

  if (!moonAttack) {
    // Apply current heat even during a cooldown that started at a lower heat.
    const cooldown = 9.5 - moonHeat * 0.075 - (extracting ? 0.85 : 0);
    moonStrikeProgress += step / cooldown;
    if (moonStrikeProgress < 1) return;
    moonStrikeProgress = 0;
    if (!moonRing) {
      moonRing = new THREE.Mesh(
        new THREE.RingGeometry(moonStrikeRadius - 1.2, moonStrikeRadius, 36),
        new THREE.MeshBasicMaterial({ color: 0xffa167, side: THREE.DoubleSide })
      );
      moonRing.rotation.x = -Math.PI / 2;
      scene.add(moonRing);
    }
    moonRing.visible = true;
    moonRing.position.set(camera.position.x, 0.18, camera.position.z);
    moonRing.material.color.setHex(0xffa167);
    const radius = extracting ? extractionStrikeRadius : moonStrikeRadius;
    moonRing.scale.setScalar(radius / moonStrikeRadius);
    moonAttack = { phase: "track", time: 0.75 - moonHeat * 0.002, radius };
    return;
  }

  moonAttack.time -= step;
  if (moonAttack.phase === "track") {
    moonRing.position.set(camera.position.x, 0.18, camera.position.z);
    if (moonAttack.time <= 0) {
      moonAttack.phase = "lock";
      moonAttack.time = extracting ? 0.72 : 0.85;
      moonRing.material.color.setHex(0xff2020);
      playMoonWarning(moonAttack.time);
    }
  } else if (moonAttack.time <= 0 && moonAttack.phase === "lock") {
    const target = moonRing.position;
    const radius = moonAttack.radius;
    fireMoonBlast(target, radius);
    moonAttack = { phase: "beam", time: 0.3 };
    if (Math.hypot(camera.position.x - target.x, camera.position.z - target.z) < radius) {
      reducePlayerHealth(25);
    }
  } else if (moonAttack.time <= 0) {
    clearMoonStrike(true);
  }
}

function createExtractionDeparture() {
  const origin = camera.position.clone();
  origin.y = 0;
  const group = new THREE.Group();
  group.position.copy(origin);

  const ring = new THREE.Mesh(new THREE.RingGeometry(0.91, 1, 40), glowMaterial(0xc4fff4, 0));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.16;
  const streak = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 1.1, 1, 12, 1, true), glowMaterial(0xe0fff8, 0));
  group.add(ring, streak);
  scene.add(group);

  const bearing = camera.rotation.y + 0.65;
  let eye = origin.clone().add(new THREE.Vector3(0, 16, 2));
  for (const turn of [0, Math.PI / 2, -Math.PI / 2, Math.PI]) {
    const angle = bearing + turn;
    const candidate = origin.clone().add(new THREE.Vector3(Math.sin(angle) * 9, 7, Math.cos(angle) * 9));
    if (!siteClear(candidate, 1)) continue;
    eye = candidate;
    break;
  }
  return { group, ring, streak, origin, eye, burst: false };
}

function updateExtractionDeparture(departure, shotCamera, age) {
  const { origin, eye, ring, streak } = departure;
  shotCamera.position.copy(eye);
  shotCamera.lookAt(origin.x, origin.y + 2.3, origin.z);
  if (age >= extractionBurstTime && !departure.burst) {
    departure.burst = true;
    if (audioCtx.state === 'running') {
      const time = audioCtx.currentTime;
      playSynthTone('sine', time, 0.26, 110, 55, 0.19, 0.009);
      playSynthTone('triangle', time, 0.3, 440, 1320, 0.14, 0.025);
    }
  }
  const progress = Math.min(1, Math.max(0, (age - extractionBurstTime) / 0.51));
  ring.scale.setScalar(1.7 + 15 * progress);
  ring.material.opacity = departure.burst ? 0.88 * (1 - progress) ** 2 : 0.36;
  streak.scale.y = 5 + progress * 28;
  streak.position.y = streak.scale.y / 2;
  streak.material.opacity = departure.burst ? 0.94 * (1 - progress) ** 3 : 0;
  renderer.render(scene, shotCamera);
}

function startExtractionSequence(site) {
  let heroSign;
  let nearestDistance = Infinity;
  for (const ad of neonAds) {
    const distance = ad.position.distanceToSquared(site);
    if (distance >= nearestDistance) continue;
    nearestDistance = distance;
    heroSign = ad;
  }
  const focus = heroSign?.position.clone() ?? site.clone();
  const bearing = (heroSign?.rotation.y ?? 0.85) + 0.28;
  const shotCamera = new THREE.PerspectiveCamera(52, camera.aspect, 0.1, 10000);
  const sweep = new THREE.Group();
  const column = new THREE.Mesh(
    new THREE.CylinderGeometry(2, 32, 1, 24, 1, true),
    glowMaterial(0xff3553, 0.18)
  );
  const ring = new THREE.Mesh(new THREE.RingGeometry(30, 32, 40), glowMaterial(0xff566c, 0.74));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.2;
  sweep.add(column, ring);
  sweep.visible = false;
  scene.add(sweep);
  escapeBeam.visible = false;
  extractionFlash.hidden = false;
  const departure = createExtractionDeparture();
  extractionSequence = {
    shotCamera, sweep, column, ring, focus, bearing, departure, age: 0, gridVisible: false, musicPlaying: false
  };
}

function updateExtractionSequence(elapsed) {
  const shot = extractionSequence;
  shot.age += elapsed;
  const { age, focus, shotCamera, sweep, column, ring } = shot;
  if (age < extractionDepartureTime) {
    updateExtractionDeparture(shot.departure, shotCamera, age);
    return;
  }
  if (shot.departure) {
    disposeObjects([shot.departure.group]);
    shot.departure = null;
    extractionFlash.hidden = true;
    sweep.visible = true;
  }
  if (age >= 1.25 && !shot.musicPlaying) {
    shot.musicPlaying = true;
    playVictoryMusic();
  }
  if (age >= 2.35 && !shot.gridVisible) {
    shot.gridVisible = true;
    openingBackdrop.classList.add('extraction-outro');
    openingBackdrop.hidden = false;
  }
  if (age >= 3.15) {
    disposeObjects([sweep]);
    extractionSequence = null;
    extractionReport.hidden = false;
    return;
  }

  const angle = shot.bearing + age * 0.14;
  const distance = 155 + age * 7;
  shotCamera.position.set(focus.x + Math.sin(angle) * distance,
    Math.max(90, focus.y + 38 + 7 * age), focus.z + Math.cos(angle) * distance);
  shotCamera.lookAt(focus.x, Math.max(24, focus.y - 16), focus.z);

  sweep.position.set(focus.x + (age - 1.55) * 66, 0, focus.z - 35);
  const toSupervisor = sun.position.clone().sub(sweep.position);
  column.position.copy(toSupervisor).multiplyScalar(0.5);
  column.scale.y = toSupervisor.length();
  column.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), toSupervisor.normalize());
  const pulse = Math.sin(Math.PI * Math.min(age / 2.55, 1));
  column.material.opacity = 0.24 * pulse;
  ring.material.opacity = 0.85 * pulse;

  const power = Math.min(1, (age - extractionDepartureTime) / 0.85);
  updateHoloads(shotCamera.position, age, elapsed, power);
  renderer.render(scene, shotCamera);
}

async function expandMap(targetX, targetZ) {
  if (!droppedKey || isDead || isVictorious) return;
  isVictorious = true;
  updateReticleVisibility();

  const gameOverDiv = document.getElementById('gameOver');
  gameOverDiv.style.color = '#8cffe8';
  gameOverDiv.style.border = '1px solid #8cffe8';
  gameOverDiv.style.display = 'block';
  const dots = startLoadingDots(gameOverDiv, "CRACKING SECTOR ICE");
  const hints = startInterceptHints();

  let section;
  try {
    section = await loadMapSection(targetX, targetZ);
  } catch (error) {
    console.error("Failed to load new map section:", error);
    isVictorious = false;
    updateReticleVisibility();
    gameOverDiv.innerText = "SECTOR SYNC FAILED";
    gameOverDiv.style.color = '#ff8b99';
    gameOverDiv.style.borderColor = '#ff8b99';
    offerMapRetry(() => {
      gameOverDiv.style.display = 'none';
      return expandMap(targetX, targetZ);
    });
    return;
  } finally {
    clearInterval(dots);
    stopInterceptHints(hints);
  }

  const vaultOrigin = takeDroppedKey();
  clearMoonStrike();
  clearBuildingHighlight();
  if (isFreeFly) setHackActive(false);
  const tracingPatrol = airplanes.find(airplane => airplane.userData.surveillance?.tracing);
  const removedEntities = [
    ...cars,
    ...airplanes.filter(airplane => airplane !== tracingPatrol)
  ];
  for (const entity of removedEntities) {
    const { x, y, z } = entity.position;
    addExplosionVisual(x, y, z, 5);
  }
  disposeObjects(removedEntities);
  cars = [];
  airplanes = tracingPatrol ? [tracingPatrol] : [];

  decryptSectorBuildings(activeSection, vaultOrigin);

  keysCollected++;
  activateSection(section);
  placeDataVault();
  if (![...sections.values()].some(loaded => isPointInSection(camera.position, loaded.box))) {
    camera.position.copy(findSafeSpawnPosition(section.box.getCenter(new THREE.Vector3()), section.box));
  }
  spawnSectionTraffic(activeSection);
  isVictorious = false;
  updateReticleVisibility();
  gameOverDiv.style.display = 'none';
  raiseMoonAlert();
  const progress = "KEY " + keysCollected + "/" + arenaRoute.length + " TAKEN";
  const nextCue = keysCollected === 1 ? "Your shots pass through decrypted wireframes. Watch for the violet sweep." :
    keysCollected === 2 ? "Supervisor online. Hear the lock alarm? Get out of the red ring." :
    keysCollected === 3 ? "Skimmers back on sweep. The Supervisor is still online." :
    "Sector ICE cracked. Route open.";
  showMessage(progress + " · " + nextCue);
}

    let impactNoise;
    function playExplosionSound() {
      if (audioCtx.state !== 'running') return;
      const time = audioCtx.currentTime;
      if (!impactNoise) {
        const length = Math.floor(audioCtx.sampleRate * 0.34);
        impactNoise = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
        const samples = impactNoise.getChannelData(0);
        let filtered = 0;

          filtered = filtered * 0.72 + (Math.random() * 2 - 1) * 0.28;
          samples[i] = filtered;

      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = impactNoise;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.28, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.33);
      noise.connect(gain).connect(effectsBus);
      noise.start(time);
      trackAudioSource(noise);
      playSynthTone('sine', time, 0.36, 73.42, 41.2, 0.38, 0.006);
      playSynthTone('triangle', time + 0.018, 0.16, 293.66, 110, 0.13);

    async function playVictoryMusic() {
      if (audioCtx.state !== 'running') {
        try {
          await audioCtx.resume();

          console.warn("Failed to play victory music:", error);

        gainNode.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.5);

        osc.start(noteTime);
        osc.stop(noteTime + 0.5);

      }

        osc.type = 'square';
        osc.frequency.setValueAtTime(arpNotes[i % arpNotes.length], noteTime);

  function isSolidBuilding(building) {
    return !building.userData.isWall && !building.userData.isCleared;
  }

  function shoot() {
    playLaserSound();
    const forwardDir = camera.getWorldDirection(new THREE.Vector3());
    const localOffset = new THREE.Vector3(playerLaserOriginX, playerLaserOriginY, playerLaserOriginZ);
    const origin = camera.position.clone().add(localOffset.applyQuaternion(camera.quaternion));

    // Aim from the reticle, and draw the beam from the offset muzzle.
    const ray = new THREE.Raycaster(camera.position, forwardDir, 0, playerShotRange);
    const vaultTargets = dataVault?.visible ? dataVault.userData.shotTargets : [];
    const targets = [...cars, ...pedestrians, ...vaultTargets];
    const target = ray.intersectObjects(targets, true)[0];
    ray.far = target?.distance ?? playerShotRange;
    const buildingsHit = raycastBuildings(ray, isSolidBuilding);
    const pierced = isFreeFly ? buildingsHit[0]?.object : null;
    const blocker = buildingsHit.find(hit => hit.object !== pierced);
    let hitTarget = blocker ? null : target?.object;
    let laserEndPoint = blocker?.point ?? target?.point ?? ray.ray.at(playerShotRange, new THREE.Vector3());
    if (vaultTargets.length > 0) {
      const muzzleDirection = laserEndPoint.clone().sub(origin);
      const muzzleRange = muzzleDirection.length();
      if (muzzleRange > 0) {
        const muzzleRay = new THREE.Raycaster(origin, muzzleDirection.multiplyScalar(1 / muzzleRange), 0, muzzleRange);
        const vaultHit = muzzleRay.intersectObjects(vaultTargets, false)[0];
        if (vaultHit) {
          laserEndPoint = vaultHit.point;
          hitTarget = vaultHit.object;
        }
      }
    }

    const direction = new THREE.Vector3().subVectors(laserEndPoint, origin).normalize();
    const length = origin.distanceTo(laserEndPoint);
    const midpoint = new THREE.Vector3().addVectors(origin, direction.clone().multiplyScalar(length / 2));
    const laserGeometry = new THREE.CylinderGeometry(0.2, 0.2, length, 8);
    const laserMaterial = new THREE.MeshBasicMaterial({ color: 0x9ffff0 });
    const laser = new THREE.Mesh(laserGeometry, laserMaterial);
    laser.position.copy(midpoint);
    const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
    laser.setRotationFromQuaternion(quaternion);
    scene.add(laser);
    setTimeout(() => disposeObjects([laser]), 500);

    if (vaultTargets.includes(hitTarget)) {
      hitDataVault();
      return;
    }

    if (hitTarget) {
      let obj = hitTarget;
      while (obj && !obj.userData.type && obj.parent) obj = obj.parent;
      if (obj && ["car", "pedestrian"].includes(obj.userData.type)) {
        const hitPosition = obj.position.clone();
        alertEnforcersNear(hitPosition, hitPosition, obj);

        if (obj.userData.type === "car") {
          disposeObjects([obj]);
          const idx = cars.indexOf(obj);
          if (idx > -1) cars.splice(idx, 1);
          showTransportExplosion(obj.position.x, obj.position.y, obj.position.z);
          regenerateHealth(1);
          charge = Math.min(fullCharge, charge + transportCharge);
          updateChargeMeter();
        } else if (obj.userData.type === "pedestrian") {
          disposeObjects([obj]);
          const idx = pedestrians.indexOf(obj);
          if (idx > -1) pedestrians.splice(idx, 1);
          createPedestrianExplosion(obj.position.x, obj.position.y, obj.position.z);
          regenerateHealth(1);
        }

      }
    }
  }

function updateTraffic() {
    if (isVictorious) return;

    // Update cars
    cars.forEach(car => {
        let road = car.userData.road;
        if (!road || road.points.length < 2) return;
        let idx = car.userData.currentIndex;
        let dir = car.userData.dir;

        car.position.add(car.userData.bounceVelocity);
        car.userData.bounceVelocity.multiplyScalar(0.9);

        let nextIdx = idx + dir;
        if (nextIdx >= 0 && nextIdx < road.points.length) {
            const target = road.points[nextIdx];
            const moveDir = new THREE.Vector3().subVectors(target, car.position).normalize();
            const distanceToTarget = car.position.distanceTo(target);
            const step = Math.min(car.userData.speed, distanceToTarget);
            car.position.add(moveDir.multiplyScalar(step));
            car.rotation.y = Math.atan2(moveDir.x, moveDir.z) + Math.PI / 2;

            if (distanceToTarget < 2) {
                car.userData.currentIndex = nextIdx;
            }
        } else {
            const candidate = chooseNewRoad(car, 15);
            if (candidate) {
                road = candidate.road;
                car.userData.road = road;
                car.userData.currentIndex = candidate.index;
                car.userData.dir = candidate.dir;
            } else {
                car.userData.dir *= -1;
            }
            nextIdx = car.userData.currentIndex + car.userData.dir;
            if (nextIdx >= 0 && nextIdx < road.points.length) {
                const target = road.points[nextIdx];
                const moveDir = new THREE.Vector3().subVectors(target, car.position).normalize();
                car.rotation.y = Math.atan2(moveDir.x, moveDir.z) + Math.PI / 2;
            }
        }

        if (car.position.x <= cityBounds.min.x || car.position.x >= cityBounds.max.x ||
            car.position.z <= cityBounds.min.z || car.position.z >= cityBounds.max.z) {
            car.userData.dir *= -1;
            nextIdx = car.userData.currentIndex + car.userData.dir;
            if (nextIdx >= 0 && nextIdx < road.points.length) {
                const target = road.points[nextIdx];
                const moveDir = new THREE.Vector3().subVectors(target, car.position).normalize();
                car.rotation.y = Math.atan2(moveDir.x, moveDir.z) + Math.PI / 2;
            }
            car.position.x = Math.max(cityBounds.min.x + 1, Math.min(cityBounds.max.x - 1, car.position.x));
            car.position.z = Math.max(cityBounds.min.z + 1, Math.min(cityBounds.max.z - 1, car.position.z));
        }

        car.position.y = carElevation;
    });

    // Update pedestrians
    pedestrians = pedestrians.filter(ped => {
        if (ped.userData.bounceVelocity.lengthSq() > 1e-6) {
            const next = ped.position.clone().add(ped.userData.bounceVelocity);
            ped.position.copy(checkBuildingCollisions(ped.position, next, ped.userData.radius));
            ped.userData.bounceVelocity.multiplyScalar(0.9);
        }

        if (!isDead) updateEnforcerPursuit(ped, simulationStep);
        const pursuit = ped.userData.pursuit;
        let moveDir;
        if (pursuit && !isDead) {
            ped.userData.speed = angryPedestrianSpeed;
            const target = pursuit.searchPoint ?? pursuit.lastKnown;
            if (ped.position.distanceToSquared(target) <= 3 ** 2) {
                moveDir = new THREE.Vector3();
            } else if (escapeBeam) {
                if (!pursuit.steering) {
                    pursuit.steering = new THREE.Vector3(target.x - ped.position.x, 0, target.z - ped.position.z)
                        .normalize().multiplyScalar(ped.userData.speed);
                    pursuit.steerTimer = Math.random() * extractionSteeringInterval;
                }
                pursuit.steerTimer -= simulationStep;
                if (pursuit.steerTimer <= 0) {
                    pursuit.steering = findPathAroundBuilding(ped, target);
                    pursuit.steerTimer += extractionSteeringInterval;
                }
                moveDir = pursuit.steering;
            } else {
                moveDir = findPathAroundBuilding(ped, target);
            }
        } else {
            ped.userData.speed = pedestrianSpeed;
            const currentPos = ped.position.clone();
            moveDir = ped.userData.dir.clone().normalize();
            // Check for obstacles ahead
            const forwardRay = new THREE.Raycaster(currentPos, moveDir, 0, ped.userData.radius * 4);
            const intersects = raycastBuildings(forwardRay);

            // Check if stuck or penetrating
            const movementDelta = currentPos.distanceTo(ped.userData.lastPosition);
            if (movementDelta < ped.userData.speed * 0.2) {
                ped.userData.stuckTimer += 1;
                if (ped.userData.stuckTimer > 10) { // Lowered threshold to react faster
                    const randomDir = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
                    const unstuckPos = currentPos.clone().addScaledVector(randomDir, ped.userData.speed * 2);
                    const unstuckCheck = checkBuildingCollisions(currentPos, unstuckPos, ped.userData.radius);
                    if (!unstuckCheck.equals(currentPos)) {
                        ped.userData.dir = randomDir;
                        ped.userData.stuckTimer = 0;
                        moveDir = randomDir;
                    }
                }
            } else {
                ped.userData.stuckTimer = 0;
            }

            if (intersects.length > 0 && intersects[0].distance < ped.userData.radius * 4) {
                const normal = intersects[0].face.normal.clone().applyQuaternion(intersects[0].object.quaternion).normalize();
                const perpDir = new THREE.Vector3(-normal.z, 0, normal.x).normalize();
                
                const leftDir = perpDir;
                const rightDir = perpDir.clone().multiplyScalar(-1);
                const chosenDir = Math.random() < 0.5 ? leftDir : rightDir;
                
                const chosenRay = new THREE.Raycaster(currentPos, chosenDir, 0, ped.userData.radius * 4);
                const chosenIntersects = raycastBuildings(chosenRay);
                
                if (chosenIntersects.length > 0 && chosenIntersects[0].distance < ped.userData.radius * 2) {
                    const altDir = chosenDir === leftDir ? rightDir : leftDir;
                    const altRay = new THREE.Raycaster(currentPos, altDir, 0, ped.userData.radius * 4);
                    const altIntersects = raycastBuildings(altRay);
                    
                    if (altIntersects.length > 0 && altIntersects[0].distance < ped.userData.radius * 2) {
                        moveDir = normal;
                    } else {
                        moveDir = altDir;
                    }
                } else {
                    moveDir = chosenDir;
                }
                
                ped.userData.dir = moveDir.clone().normalize();
            }

            moveDir.multiplyScalar(ped.userData.speed);
            ped.userData.lastPosition.copy(currentPos);
        }

        // Pedestrian collision detection with other pedestrians
        const collisionThresholdSquared = (ped.userData.radius * 2) ** 2;
        let hasCollided = false;
        for (let otherPed of pedestrians) {
            if (otherPed === ped) continue;
            if (ped.position.distanceToSquared(otherPed.position) < collisionThresholdSquared) {
                hasCollided = true;
                const avoidDir = new THREE.Vector3().subVectors(ped.position, otherPed.position).normalize();
                ped.userData.bounceVelocity.addScaledVector(avoidDir, 0.5);
                otherPed.userData.bounceVelocity.addScaledVector(avoidDir, -0.5);
                const blendFactor = 0.3;
                ped.userData.dir.lerp(avoidDir, blendFactor).normalize();
                otherPed.userData.dir.lerp(avoidDir.clone().multiplyScalar(-1), blendFactor).normalize();
                break;
            }
        }

        const nextPos = ped.position.clone().add(moveDir);
        ped.position.copy(checkBuildingCollisions(ped.position, nextPos, ped.userData.radius));

        // Boundary clamping
        ped.position.x = Math.max(cityBounds.min.x + ped.userData.radius * 2,
            Math.min(cityBounds.max.x - ped.userData.radius * 2, ped.position.x));
        ped.position.z = Math.max(cityBounds.min.z + ped.userData.radius * 2,
            Math.min(cityBounds.max.z - ped.userData.radius * 2, ped.position.z));

        const targetPos = ped.position.clone().add(moveDir);
        ped.lookAt(targetPos.x, ped.position.y, targetPos.z);

        let canMove = true;
        cars.forEach(car => {
            const d = ped.position.distanceTo(car.position);
            if (d < 5) {
                canMove = false;
                const avoidDir = new THREE.Vector3().subVectors(ped.position, car.position).normalize();
                const next = ped.position.clone().addScaledVector(avoidDir, ped.userData.speed);
                ped.position.copy(checkBuildingCollisions(ped.position, next, ped.userData.radius));
                ped.userData.bounceVelocity.addScaledVector(avoidDir, ped.userData.speed * 2);
            }
        });

        const playerDist = ped.position.distanceTo(camera.position);
        if (playerDist < 5) {
            createPedestrianExplosion(ped.position.x, ped.position.y, ped.position.z);
            disposeObjects([ped]);
            return false;
        }

        if (canMove && !hasCollided) {
            ped.userData.walkCycle += ped.userData.speed;
            const swing = Math.sin(ped.userData.walkCycle);
            ped.children.forEach(child => {
                if (child.userData.isArm) {
                    child.rotation.x = child.userData.isLeft ? -swing * 0.5 : swing * 0.5;
                    if (child.children[0]) child.children[0].rotation.x = -swing * 0.3;
                } else if (child.userData.isLeg) {
                    child.rotation.x = (child.userData.isLeft ? 1 : -1) * swing * 0.5;
                    if (child.children[0]) child.children[0].rotation.x = -swing * 0.3;
                }
            });
        }

        // Pedestrian shooting logic
        if (pursuit?.seeing && !isDead) {
            ped.userData.shootTimer += 1;
            if (ped.userData.shootTimer >= pedestrianShootingInterval) {
                ped.userData.shootTimer = 0;

                // Calculate shooting origin and direction
                const localOffset = new THREE.Vector3(pedLaserOriginX, pedLaserOriginY, pedLaserOriginZ);
                const worldOffset = localOffset.clone().applyQuaternion(ped.quaternion);
                const origin = ped.position.clone().add(worldOffset);
                const direction = new THREE.Vector3().subVectors(camera.position, origin).normalize();
                const distanceToPlayer = origin.distanceTo(camera.position);

                // Check if player is out of range
                if (distanceToPlayer > pedestrianShootingRange) return true;

                // Check line-of-sight with all buildings (including walls)
                const raycaster = new THREE.Raycaster(origin, direction, 0, distanceToPlayer);
                const intersects = raycastBuildings(raycaster);

                // If any building blocks the shot and is closer than the player
                if (intersects.length > 0 && intersects[0].distance < distanceToPlayer) {
                    return true; // Shot blocked by a building
                }
                if (dataVault?.visible && raycaster.intersectObjects(dataVault.userData.shotTargets, false).length) {
                    return true;
                }

                // Play laser sound and create laser visual
                playLaserSound(true);
                const laserEndOffset = 1.0;
                const offsetDirection = direction.clone().multiplyScalar(-1);
                const laserEndPoint = camera.position.clone().add(offsetDirection.multiplyScalar(laserEndOffset));
                const laserLength = origin.distanceTo(laserEndPoint);
                const midpoint = origin.clone().add(direction.clone().multiplyScalar(laserLength / 2));
                const laserGeometry = new THREE.CylinderGeometry(0.2, 0.2, laserLength, 8);
                const laserMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const laser = new THREE.Mesh(laserGeometry, laserMaterial);
                laser.position.copy(midpoint);
                const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
                laser.setRotationFromQuaternion(quaternion);
                scene.add(laser);
                setTimeout(() => disposeObjects([laser]), 500);

                // Apply 70% hit chance for this shot
                if (Math.random() < 0.7) {
                    reducePlayerHealth(1);
                    const hitIndicator = document.getElementById('hitIndicator');
                    hitIndicator.style.animation = 'blink 0.5s';
                    setTimeout(() => { hitIndicator.style.animation = ''; }, 500);
                    if (playerHealth <= 0 && !isDead) {
                        showDeathScreen();
                    }
                }

                // Alert nearby pedestrians
                alertEnforcersNear(ped.position, camera.position, ped);
            }
        }
        return true;
    });

    checkCarCollisions();

    // Update airplanes
    airplanes.forEach(airplane => {
        if (airplane.userData.surveillance) {
            if (!isDead) updateSurveillancePatrol(airplane, simulationStep);
            return;
        }
        const moveDir = airplane.userData.direction.clone();
        const step = airplane.userData.speed;

        if (airplane.position.x <= cityBounds.min.x || airplane.position.x >= cityBounds.max.x ||
            airplane.position.z <= cityBounds.min.z || airplane.position.z >= cityBounds.max.z) {
            airplane.userData.direction.multiplyScalar(-1);
            airplane.rotation.y += Math.PI;
            airplane.position.x = Math.max(cityBounds.min.x + 1, Math.min(cityBounds.max.x - 1, airplane.position.x));
            airplane.position.z = Math.max(cityBounds.min.z + 1, Math.min(cityBounds.max.z - 1, airplane.position.z));
        } else {
            airplane.position.add(moveDir.multiplyScalar(step));
        }

        airplane.position.y = airplaneAltitude;
    });
    if (escapeBeam && !isDead) {
      extractionSweepTimer = Math.max(0, extractionSweepTimer - simulationStep);
      if (extractionSweepTimer === 0 && airplanes.some(airplane => airplane.userData.surveillance?.inCone)) {
        playSkimmerSweep();
        extractionSweepTimer = 0.45;
      }
    }

    const wasHunting = huntingPedestrians > 0;
    huntingPedestrians = 0;
    sightedEnforcers = 0;
    for (const enforcer of pedestrians) {
      if (!enforcer.userData.pursuit) continue;
      huntingPedestrians++;
      if (enforcer.userData.pursuit.seeing) sightedEnforcers++;
    }
    if (huntingPedestrians > 0 && !wasHunting) {
      showMessage("Enforcers are tracing you. Break sight and turn off the street.");
      playEnforcerSignal(true);
    } else if (huntingPedestrians === 0 && wasHunting) {
      showMessage("Enforcer trace dropped.");
      playEnforcerSignal(false);
    }
}

    function updateExplosions() {
      const currentTime = performance.now();
      for (let i = explosions.length - 1; i >= 0; i--) {
        const explosion = explosions[i];
        const elapsed = (currentTime - explosion.userData.startTime) / 1000;
        explosion.scale.setScalar(1 + elapsed * 2);
        explosion.material.opacity = Math.max(0, 0.8 - elapsed);
        if (elapsed > 0.5) {
          disposeObjects([explosion]);
          explosions.splice(i, 1);
        }
      }
    }

    const hasTouchControls = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    const showDesktopHints = !hasTouchControls || window.matchMedia('(any-pointer: fine)').matches;
    const movementDirection = new THREE.Vector2(0, 0);
    const lookingDirection = new THREE.Vector2(0, 0);
    let movementTouchId = null;
    let lookingTouchId = null;

    const leftJoystick = document.getElementById('left-joystick');
    const rightJoystick = document.getElementById('right-joystick');
    const flyButton = document.getElementById('fly-button');
    const mapButton = document.getElementById('map-button');

    function updateJoystickDirection(touch, joystick, directionObj) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = touch.clientX - centerX;
      const dy = touch.clientY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const maxDistance = rect.width / 2;
      const normalizedDistance = Math.min(distance / maxDistance, 1);
      const angle = Math.atan2(dy, dx);
      directionObj.set(Math.cos(angle) * normalizedDistance, -Math.sin(angle) * normalizedDistance);
    }

    if (hasTouchControls) {
      leftJoystick.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (movementTouchId === null && e.targetTouches.length > 0) {
          const touch = e.targetTouches[0];
          if (touch.identifier !== lookingTouchId) {
            movementTouchId = touch.identifier;
            updateJoystickDirection(touch, leftJoystick, movementDirection);
            startMusicOnInteraction();
          }
        }
      }, { passive: false });

      rightJoystick.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (lookingTouchId === null && e.targetTouches.length > 0) {
          const touch = e.targetTouches[0];
          if (touch.identifier !== movementTouchId) {
            lookingTouchId = touch.identifier;
            updateJoystickDirection(touch, rightJoystick, lookingDirection);
            startMusicOnInteraction();
          }
        }
      }, { passive: false });
      document.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.touches.length; i++) {
          const touch = e.touches[i];
          if (touch.identifier === movementTouchId) {
            updateJoystickDirection(touch, leftJoystick, movementDirection);
          } else if (touch.identifier === lookingTouchId) {
            updateJoystickDirection(touch, rightJoystick, lookingDirection);
          }
        }
      }, { passive: false });

      function releaseJoysticks(e) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const touch = e.changedTouches[i];
          if (touch.identifier === movementTouchId) {
            if (e.cancelable) e.preventDefault();
            movementTouchId = null;
            movementDirection.set(0, 0);
          }
          if (touch.identifier === lookingTouchId) {
            if (e.cancelable) e.preventDefault();
            lookingTouchId = null;
            lookingDirection.set(0, 0);
            if (e.type === 'touchend' && gameplayReady && !isDead && !isVictorious) shoot();
          }
        }
      }
      document.addEventListener('touchend', releaseJoysticks, { passive: false });
      document.addEventListener('touchcancel', releaseJoysticks, { passive: false });

        flyButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameplayReady || isDead || isVictorious) return;
            if (charge <= 0) {
                showMessage("Hack offline. Breach a data transport to refill the buffer.");
                return;
            }
            setHackActive(!isFreeFly);
            startMusicOnInteraction();
        }, { passive: false });
      
      mapButton.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameplayReady || isDead || isVictorious) return;
        birdViewActive = !birdViewActive;
        mapButton.classList.toggle('active', birdViewActive);
        updateReticleVisibility();
        startMusicOnInteraction();
      }, { passive: false });

      [flyButton, mapButton].forEach(button =>
        button.addEventListener('touchmove', e => e.preventDefault(), { passive: false })
      );
    } else {
      document.getElementById('controls').style.display = 'none';
    }

    const keys = {};
    let yaw = 0;
    let pitch = 0;
    const rotationSpeed = 0.001;
    let isFreeFly = false;
    let hackMoving = false;

   function setHackActive(active) {
       isFreeFly = active;
       hackMoving = false;
       flyButton.classList.toggle('active', active);
       if (!active) {
           camera.position.y = playerHeight;
           pitch = 0;
           camera.rotation.x = 0;
           clearBuildingHighlight();
       }
       updateReticleVisibility();
   }

   function updateReticleVisibility() {
       const visible = gameplayReady && !isDead && !isVictorious && !birdViewActive;
       document.getElementById('reticle').style.display = visible ? 'block' : 'none';
       updateArenaStatus();
   }

   document.addEventListener('keydown', (e) => {
       if (!gameplayReady || isDead || isVictorious) return;
       keys[e.key.toLowerCase()] = true;
       if (e.key.toLowerCase() === 'f' && !e.repeat) {
           if (charge <= 0) {
               showMessage("Hack offline. Breach a data transport to refill the buffer.");
               return;
           }
           setHackActive(!isFreeFly);
       }
   });


    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });
    window.addEventListener('blur', () => {
      for (const key of Object.keys(keys)) keys[key] = false;
      movementDirection.set(0, 0);
      lookingDirection.set(0, 0);
      movementTouchId = null;
      lookingTouchId = null;
    });
    window.addEventListener('mousemove', (e) => {
      if (!gameplayReady || isDead || isVictorious || document.pointerLockElement !== document.body) return;
      yaw -= e.movementX * rotationSpeed;
      pitch -= e.movementY * rotationSpeed;
      pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

function projectOntoScan(point) {
  const projected = point.clone().project(birdCamera);
  return {
    x: (projected.x + 1) * window.innerWidth / 2,
    y: (1 - projected.y) * window.innerHeight / 2
  };
}

function updateScanOverlay() {
  const visible = gameplayReady && birdViewActive && !isDead && !isVictorious;
  scanOverlay.hidden = !visible;
  if (scanPassages) scanPassages.visible = visible;
  if (!visible) return;

  birdCamera.updateMatrixWorld(true);
  const playerPoint = camera.position.clone();
  playerPoint.y = 0;
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const player = projectOntoScan(playerPoint);
  const facing = projectOntoScan(playerPoint.clone().addScaledVector(forward, 35));
  const heading = Math.atan2(facing.x - player.x, player.y - facing.y);
  scanHeading.style.transform =
    `translate(${player.x}px, ${player.y}px) translate(-50%, -50%) rotate(${heading}rad)`;

  const point = escapeBeam?.userData.site ?? droppedKey?.position ?? dataVault?.position;
  scanTarget.hidden = !point;
  const target = point ? projectOntoScan(point) : null;
  if (target) {
    const label = escapeBeam ? "EXTRACTION POINT" :
      (droppedKey ? "ENCRYPTION KEY · " : "VAULT · ") + activeSection.corporation.name;
    if (scanTarget.textContent !== label) scanTarget.textContent = label;
    scanTarget.classList.toggle('extraction', !!escapeBeam);
    scanTarget.style.transform =
      `translate(${target.x}px, ${target.y - 12}px) translate(-50%, -100%)`;
  }

  for (const section of sections.values()) {
    const center = section.box.getCenter(new THREE.Vector3());
    center.y = 0;
    const screen = projectOntoScan(center);
    section.scanLabel.hidden = Math.hypot(screen.x - player.x, screen.y - player.y) < 25 ||
      (target && Math.hypot(screen.x - target.x, screen.y - target.y) < 45);
    section.scanLabel.style.transform =
      `translate(${screen.x}px, ${screen.y}px) translate(-50%, -50%)`;
  }
}

let highlightedBuilding = null;
let highlightedOriginalMaterial = null;
let hackSweep = null;
let hackSweepPhase = 0;

function clearBuildingHighlight() {
  if (!highlightedBuilding) return;
  highlightedBuilding.material.dispose();
  highlightedBuilding.material = highlightedOriginalMaterial;
  highlightedBuilding = null;
  highlightedOriginalMaterial = null;
  if (hackSweep) hackSweep.visible = false;
}

function updateBuildingHighlight(elapsed) {
  const direction = camera.getWorldDirection(new THREE.Vector3());
  const ray = new THREE.Raycaster(camera.position, direction, 0, playerShotRange);
  const building = raycastBuildings(ray, isSolidBuilding)[0]?.object ?? null;
  if (building !== highlightedBuilding) {
    clearBuildingHighlight();
    if (!building) return;
    highlightedBuilding = building;
    highlightedOriginalMaterial = building.material;
    building.material = glowMaterial(0x8affe2, 0.45);
    building.material.wireframe = true;
    hackSweepPhase = 0;
    if (!hackSweep) {
      hackSweep = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMaterial(0xd8a2ff, 0.25));
      hackSweep.rotation.x = -Math.PI / 2;
      scene.add(hackSweep);
    }
    const box = building.userData.box;
    const size = box.getSize(new THREE.Vector3());
    box.getCenter(hackSweep.position);
    hackSweep.scale.set(size.x + 1.8, size.z + 1.8, 1);
    hackSweep.visible = true;
  }
  if (!building) return;
  hackSweepPhase = (hackSweepPhase + elapsed * 0.85) % 1;
  const { min, max } = building.userData.box;
  hackSweep.position.y = min.y + (max.y - min.y) * hackSweepPhase;
  const pulse = Math.sin(hackSweepPhase * Math.PI);
  hackSweep.material.opacity = pulse * 0.34;
  building.material.opacity = 0.38 + pulse * 0.42;
}

// Keep the movement and combat values calibrated to 60 simulation updates per second.
const simulationStep = 1 / 60;
let previousFrameTime;
let pendingSimulationTime = 0;

function updatePlayer() {
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  forward.y = 0; right.y = 0; forward.normalize(); right.normalize();
  let deltaX = 0;
  let deltaZ = 0;

  if (movementDirection.lengthSq() > 0) {
    const movement = forward.clone().multiplyScalar(movementDirection.y)
      .addScaledVector(right, movementDirection.x).multiplyScalar(moveSpeed);
    deltaX = movement.x;
    deltaZ = movement.z;
  } else {
    if (keys['w']) { deltaX += forward.x * moveSpeed; deltaZ += forward.z * moveSpeed; }
    if (keys['s']) { deltaX -= forward.x * moveSpeed; deltaZ -= forward.z * moveSpeed; }
    if (keys['a']) { deltaX -= right.x * moveSpeed; deltaZ -= right.z * moveSpeed; }
    if (keys['d']) { deltaX += right.x * moveSpeed; deltaZ += right.z * moveSpeed; }
  }

  const currentPos = camera.position.clone();
  const nextPos = new THREE.Vector3(
    currentPos.x + deltaX,
    playerHeight,
    currentPos.z + deltaZ
  );
  const resolvedPosition = checkBuildingCollisions(currentPos, nextPos, playerRadius);

  if (isFreeFly) {
    alertEnforcersNear(resolvedPosition);
    hackMoving = (resolvedPosition.x - currentPos.x) ** 2 + (resolvedPosition.z - currentPos.z) ** 2 > 1e-8;
    const remaining = charge - hackBufferDrain * (hackMoving ? 2 : 1) * simulationStep;
    charge = remaining > 1e-8 ? remaining : 0;
    updateChargeMeter();
    if (charge <= 0) {
      setHackActive(false);
      showMessage("Buffer dry. Hack offline.");
    }
  }

  // Apply collision check for player movement in both modes
  camera.position.copy(resolvedPosition);
  camera.position.y = playerHeight;

  if (lookingDirection.lengthSq() > 0) {
    const lookSpeed = 0.1;
    yaw -= lookingDirection.x * lookSpeed;
    pitch += lookingDirection.y * lookSpeed;
    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  }
}

function updateHoloads(viewpoint, time, elapsed, power = 1) {
  for (const ad of neonAds) {
    ad.visible = viewpoint != null && ad.position.distanceToSquared(viewpoint) < 670 ** 2;
    if (!ad.visible) continue;
    const { phase, restY, material } = ad.userData;
    const signal = Math.sin(time * 1.6 + phase);
    const flicker = 0.15 + 0.42 * Math.sin(time * 8 + phase) ** 2;
    ad.rotation.y += 0.6 * elapsed;
    ad.position.y = restY + signal * 1.4;
    material.opacity = (0.82 + 0.15 * signal) * (power + (1 - power) * flicker);
  }
}

function animate(frameTime) {
  if (escaped && !extractionSequence) return;
  requestAnimationFrame(animate);
  const elapsed = Math.min(0.1, (frameTime - (previousFrameTime ?? frameTime)) / 1000);
  previousFrameTime = frameTime;
  if (!sceneLoaded) return;
  if (extractionSequence) {
    updateExtractionSequence(elapsed);
    return;
  }

  if (gameplayReady) pendingSimulationTime += elapsed;
  while (!isDead && !isVictorious && pendingSimulationTime + 1e-9 >= simulationStep) {
    pendingSimulationTime -= simulationStep;
    updateTraffic();
    if (!isDead) {
      updateTransportSupply(simulationStep);
      updatePlayer();
      updateKeyPickup(simulationStep);
      updateEscape();
      if (!isVictorious) updateMoon(simulationStep);
    }
  }
  if (escaped) return;
  updateArenaStatus();
  if (isDead || isVictorious) pendingSimulationTime = 0;

  updateExplosions();
  updateVaultBeacon(elapsed);
  updateDroppedKey(elapsed);
  updateVaultBurst(elapsed);
  updateDecryptionWave(elapsed);
  updateSkimmerSweep(elapsed);
  updateEscapeBeam(elapsed);
  updateMoonBlast(elapsed);
  const time = frameTime / 1000;
  updateHoloads(birdViewActive ? null : camera.position, time, elapsed);

  if (enableWallAnimation) {
    const cameraPos = camera.position;
    wallParticleSystems.forEach(system => {
      if (!system.userData.wall.userData.isPassable) {
        const positions = system.geometry.attributes.position.array;
        const speeds = system.userData.speeds;
        const baseYs = system.userData.baseYs;
        const distToWall = Math.min(cameraPos.distanceTo(system.position), 200);
        const detailFactor = 1 - (distToWall / 200);
        system.material.opacity = Math.max(0.2, detailFactor * 0.8);
        for (let i = 0; i < positions.length / 3; i++) {
          positions[i * 3 + 1] += speeds[i] * elapsed * 60;
          if (positions[i * 3 + 1] > wallHeight) {
            positions[i * 3 + 1] = baseYs[i];
          }
        }
        system.geometry.attributes.position.needsUpdate = true;
      }
    });
  }

  const canHighlight = isFreeFly && !isDead && !isVictorious;
  if (canHighlight) updateBuildingHighlight(elapsed);
  else clearBuildingHighlight();
  chargeMeter.classList.toggle('pulse', canHighlight);

  const mapView = isDead || birdViewActive;
  if (mapView) {
    const center = cityBounds.getCenter(new THREE.Vector3());
    const size = cityBounds.getSize(new THREE.Vector3());
    const fieldOfView = Math.tan(birdCamera.fov * Math.PI / 360);
    const span = Math.max(size.z, size.x / birdCamera.aspect);
    birdCamera.position.set(center.x, span * 0.55 / fieldOfView + wallHeight, center.z);
    birdCamera.lookAt(center.x, 0, center.z);
    birdCamera.rotation.y += Math.PI;
  }
  updateScanOverlay();
  if (scanPassages?.visible) scanPassages.material.opacity = 0.78 + 0.22 * Math.sin(time * 2.8);
  renderer.render(scene, mapView ? birdCamera : camera);
}
requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      birdCamera.aspect = window.innerWidth / window.innerHeight;
      birdCamera.updateProjectionMatrix();
      if (extractionSequence) {
        extractionSequence.shotCamera.aspect = camera.aspect;
        extractionSequence.shotCamera.updateProjectionMatrix();
      }
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (isDead) {
        showNoiseOverlay();
      }
    });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const musicBus = audioCtx.createGain();
    musicBus.gain.value = 0.29;
    musicBus.connect(audioCtx.destination);
    const effectsBus = audioCtx.createGain();
    effectsBus.gain.value = 0.76;
    effectsBus.connect(audioCtx.destination);
    const loopLength = 60;
    const activeAudioSources = new Set();
    const gameplayMusicSources = new Set();

    function trackAudioSource(source, sources = activeAudioSources) {
      sources.add(source);
      source.addEventListener('ended', () => {
        sources.delete(source);
        source.disconnect();
      }, { once: true });
    }

    function playSynthTone(type, start, duration, pitch, endPitch, level, attack = 0.014) {
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(pitch, start);
      oscillator.frequency.exponentialRampToValueAtTime(endPitch, start + duration);
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(level, start + attack);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
      oscillator.connect(gain).connect(effectsBus);
      oscillator.start(start);
      oscillator.stop(start + duration);
      trackAudioSource(oscillator);
    }
    let musicTimeout = null;

    function startCyberpunkMusic() {
      function scheduleBass(startTime, second) {
        const bassPattern = [60, 62, 64, 65, 67, 69, 71, 72];
        for (let i = second; i < second + 1; i += 0.25) {
          let noteTime = startTime + i;
          let freq = bassPattern[Math.floor(i / 2) % bassPattern.length] * 2;
          const osc = audioCtx.createOscillator();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(freq, noteTime);
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0, noteTime);
          gainNode.gain.linearRampToValueAtTime(0.9, noteTime + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.25);
          osc.connect(gainNode).connect(musicBus);
          osc.start(noteTime);
          osc.stop(noteTime + 0.3);
          trackAudioSource(osc, gameplayMusicSources);
        }
      }

      function scheduleLead(startTime, notes) {
        for (const { offset, frequency } of notes) {
          const eventTime = startTime + offset;
          const osc = audioCtx.createOscillator();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(frequency, eventTime);
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0, eventTime);
          gainNode.gain.linearRampToValueAtTime(0.6, eventTime + 0.005);
          gainNode.gain.exponentialRampToValueAtTime(0.001, eventTime + 0.2);
          osc.connect(gainNode).connect(musicBus);
          osc.start(eventTime);
          osc.stop(eventTime + 0.25);
          trackAudioSource(osc, gameplayMusicSources);
        }
      }

      function schedulePad(chordTime) {
        const chord = [110, 130.81, 164.81];
        chord.forEach(freq => {
          const osc = audioCtx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq * 2, chordTime);
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0, chordTime);
          gainNode.gain.linearRampToValueAtTime(0.5, chordTime + 0.5);
          gainNode.gain.linearRampToValueAtTime(0.5, chordTime + 3);
          gainNode.gain.linearRampToValueAtTime(0.001, chordTime + 3.5);
          osc.connect(gainNode).connect(musicBus);
          osc.start(chordTime);
          osc.stop(chordTime + 4);
          trackAudioSource(osc, gameplayMusicSources);
        });
      }

      function schedulePercussion(startTime, second) {
        for (let i = second; i < second + 1; i += 0.5) {
          let kickTime = startTime + i;
          const osc = audioCtx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(100, kickTime);
          osc.frequency.exponentialRampToValueAtTime(50, kickTime + 0.05);
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(1, kickTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, kickTime + 0.15);
          osc.connect(gainNode).connect(musicBus);
          osc.start(kickTime);
          osc.stop(kickTime + 0.2);
          trackAudioSource(osc, gameplayMusicSources);

          if (i % 1 === 0.5) {
            const noiseTime = startTime + i;
            const bufferSize = audioCtx.sampleRate * 0.05;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;
            const gainNode2 = audioCtx.createGain();
            gainNode2.gain.setValueAtTime(0.7, noiseTime);
            gainNode2.gain.exponentialRampToValueAtTime(0.001, noiseTime + 0.1);
            noiseSource.connect(gainNode2).connect(musicBus);
            noiseSource.start(noiseTime);
            noiseSource.stop(noiseTime + 0.15);
            trackAudioSource(noiseSource, gameplayMusicSources);
          }
        }
      }

      function scheduleChord(chordTime) {
        const chord = [220, 261.63, 329.63];
        chord.forEach(freq => {
          const osc = audioCtx.createOscillator();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, chordTime);
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0, chordTime);
          gainNode.gain.linearRampToValueAtTime(0.7, chordTime + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.001, chordTime + 0.4);
          osc.connect(gainNode).connect(musicBus);
          osc.start(chordTime);
          osc.stop(chordTime + 0.45);
          trackAudioSource(osc, gameplayMusicSources);
        });
      }

      function scheduleArpeggio(arpStart) {
        const arpeggioNotes = [330, 392, 440, 494];
        arpeggioNotes.forEach((freq, idx) => {
          let noteTime = arpStart + idx * 0.2;
          const osc = audioCtx.createOscillator();
          osc.type = "square";
          osc.frequency.setValueAtTime(freq, noteTime);
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0, noteTime);
          gainNode.gain.linearRampToValueAtTime(0.5, noteTime + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.15);
          osc.connect(gainNode).connect(musicBus);
          osc.start(noteTime);
          osc.stop(noteTime + 0.18);
          trackAudioSource(osc, gameplayMusicSources);
        });
      }

      function scheduleHiHats(startTime, second) {
        for (let i = second; i < second + 1; i += 0.25) {
          let hatTime = startTime + i;
          const bufferSize = audioCtx.sampleRate * 0.03;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
          const noiseSource = audioCtx.createBufferSource();
          noiseSource.buffer = buffer;
          const gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0.3, hatTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, hatTime + 0.05);
          noiseSource.connect(gainNode).connect(musicBus);
          noiseSource.start(hatTime);
          noiseSource.stop(hatTime + 0.06);
          trackAudioSource(noiseSource, gameplayMusicSources);
        }
      }

      let musicStartTime;
      let nextSecond = 0;
      let leadCycle = -1;
      let leadNotes;

      function scheduleSecond(second) {
        const cycle = Math.floor(second / loopLength);
        const offset = second % loopLength;
        const cycleStart = musicStartTime + cycle * loopLength;

        if (cycle !== leadCycle) {
          leadCycle = cycle;
          leadNotes = Array.from({ length: loopLength }, () => []);
          for (let i = 0; i < 20; i++) {
            const noteOffset = Math.random() * loopLength;
            leadNotes[Math.floor(noteOffset)].push({ offset: noteOffset, frequency: 400 + Math.random() * 300 });
          }
        }

        scheduleBass(cycleStart, offset);
        scheduleLead(cycleStart, leadNotes[offset]);
        schedulePercussion(cycleStart, offset);
        scheduleHiHats(cycleStart, offset);
        if (offset % 4 === 0) schedulePad(cycleStart + offset);
        if (offset % 8 === 0) scheduleChord(cycleStart + offset);
        if (offset % 10 === 0) scheduleArpeggio(cycleStart + offset);
      }

      function scheduleMusic() {
        if (isDead || escaped) return;
        const now = audioCtx.currentTime;
        // When a backgrounded tab wakes late, skip expired notes instead of playing a backlog.
        if (musicStartTime + nextSecond < now - 0.25) {
          nextSecond = Math.ceil(now - musicStartTime);
        }
        while (musicStartTime + nextSecond <= now + 0.25) {
          scheduleSecond(nextSecond);
          nextSecond++;
        }
        musicTimeout = setTimeout(scheduleMusic, 100);
      }

      audioCtx.resume().then(() => {
        if (isDead || escaped) return;
        musicStartTime = audioCtx.currentTime + 0.1;
        scheduleMusic();
      }).catch(error => {
        musicStarted = false;
        console.warn("Failed to start music:", error);
      });
    }

    function stopAudioSources(sources) {
      for (const source of sources) {
        try { source.stop(); } catch (e) {}
      }
      sources.clear();
    }

    function stopCyberpunkMusic() {
      if (musicTimeout !== null) clearTimeout(musicTimeout);
      musicTimeout = null;
      stopAudioSources(gameplayMusicSources);
    }

    let musicStarted = false;
    function startMusicOnInteraction() {
      if (!gameplayReady || musicStarted || isDead || escaped) return;
      musicStarted = true;
      startCyberpunkMusic();
    }
    document.addEventListener('click', startMusicOnInteraction);

    function reducePlayerHealth(amount) {
        playerHealth = Math.max(0, playerHealth - amount);
        healthDisplay.innerText = 'LINK INTEGRITY ' + playerHealth + '%';
        
        // Use the same hit indicator effect as when shot
        const hitIndicator = document.getElementById('hitIndicator');
        hitIndicator.style.animation = 'blink 0.5s';
        setTimeout(() => { hitIndicator.style.animation = ''; }, 500);

        if (playerHealth <= 0) {
            showDeathScreen();
        }
    }

    function regenerateHealth(amount = 1) {
        if (!isDead && playerHealth < 100) {
            playerHealth = Math.min(100, playerHealth + amount);
            healthDisplay.innerText = 'LINK INTEGRITY ' + playerHealth + '%';
        }
    }
    const fontLoader = new THREE.FontLoader();
    fontLoader.load(
      'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/droid/droid_sans_regular.typeface.json',
      loadedFont => {
        font = loadedFont;
      },
      undefined,
      (error) => { console.error("Font loading failed:", error); }
    );

    playOpening();
  </script>
